function encodeSave(d){try{return btoa(unescape(encodeURIComponent(JSON.stringify(d))));}catch(e){return'';}}
function decodeSave(c){try{return JSON.parse(decodeURIComponent(escape(atob(c.trim().replace(/\s/g,'')))));}catch(e){return null;}}
function easeOutCubic(t){return 1-Math.pow(1-t,3);}
function lerpColor(c1,c2,t){return[Math.round(c1[0]+(c2[0]-c1[0])*t),Math.round(c1[1]+(c2[1]-c1[1])*t),Math.round(c1[2]+(c2[2]-c1[2])*t)];}

async function doPasteToInput(target){
  let text='';
  try{if(navigator.clipboard&&navigator.clipboard.readText){text=await navigator.clipboard.readText();}}catch(e){text='';}
  if(!text){try{text=window.prompt('请粘贴内容：','')||'';}catch(e){text='';}}
  if(!text)return;
  if(target==='name'){text=text.replace(/[\x00-\x1f\x7f]/g,'');if(nameInputText.length+text.length>16)text=text.slice(0,16-nameInputText.length);nameInputText+=text;}
  else if(target==='save'){saveCodeInputText+=text;}
  else if(target==='seed'){text=text.replace(/[^0-9\-]/g,'');if(seedInputText.length+text.length>20)text=text.slice(0,20-seedInputText.length);seedInputText+=text;}
}
function drawPasteButton(btn,active){
  ctx.fillStyle=active?'#5a8a5a':'#4a6a8a';ctx.fillRect(btn.x,btn.y,btn.w,btn.h);
  ctx.strokeStyle=active?'#8fc':'#8ab';ctx.lineWidth=2;ctx.strokeRect(btn.x,btn.y,btn.w,btn.h);
  ctx.fillStyle='#fff';ctx.font='bold 16px '+FONT;ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText('粘贴',btn.x+btn.w/2,btn.y+btn.h/2);
}
function drawDeleteButton(btn,active){
  ctx.fillStyle=active?'#8a5a5a':'#6a4a4a';ctx.fillRect(btn.x,btn.y,btn.w,btn.h);
  ctx.strokeStyle=active?'#fcc':'#c88';ctx.lineWidth=2;ctx.strokeRect(btn.x,btn.y,btn.w,btn.h);
  ctx.fillStyle='#fff';ctx.font='bold 18px '+FONT;ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText('⇠',btn.x+btn.w/2,btn.y+btn.h/2);
}

function createFallbackTile(type){
  const c=document.createElement('canvas');c.width=TILE;c.height=TILE;
  const cctx=c.getContext('2d');const cell=TILE/2;
  cctx.fillStyle='#000000';cctx.fillRect(0,0,TILE,TILE);
  cctx.fillStyle='#FF00FF';cctx.fillRect(0,0,cell,cell);cctx.fillRect(cell,cell,cell,cell);
  return c;
}
function createItemIcon(itemType){
  const c=document.createElement('canvas');c.width=32;c.height=32;
  const cctx=c.getContext('2d');cctx.imageSmoothingEnabled=false;
  const oreBlock=ITEM_ICON_BLOCK[itemType];
  if(oreBlock&&tileCanvasCache[oreBlock]){cctx.drawImage(tileCanvasCache[oreBlock],0,0,32,32);return c;}
  const blockType=ITEM_TO_BLOCK[itemType];
  if(blockType&&tileCanvasCache[blockType]){cctx.drawImage(tileCanvasCache[blockType],0,0,32,32);return c;}
  cctx.fillStyle='#000';cctx.fillRect(0,0,32,32);
  cctx.fillStyle='#FF00FF';cctx.fillRect(0,0,16,16);cctx.fillRect(16,16,16,16);
  return c;
}

    img.src=SPECIAL_ITEM_URLS[it];
  });

  loadOne(i=>{playerSkin=i;playerSkinAspect=i.naturalWidth/i.naturalHeight;}).src=STEVE_URL;

const chunks=new Map(),blockChanges=new Map();
function seededRandom(seed){const x=Math.sin(seed)*10000;return x-Math.floor(x);}
function getSurfaceHeight(worldX){
  const s=worldSeed*0.00013;
  const h1=Math.sin((worldX+s*100)*0.08)*4.0;
  const h2=Math.sin((worldX+s*100)*0.21+2.5)*3.0;
  const h3=Math.sin((worldX+s*100)*0.45+5.0)*1.5;
  const h4=Math.sin((worldX+s*100)*0.03+1.0)*8.0;
  let h=Math.round(CHUNK_H-40+h1+h2+h3+h4);
  return Math.max(20,Math.min(CHUNK_H-6,h));
}
function noise2D(x,y,seed){
  const n=Math.sin(x*12.9898+y*78.233+seed*43.7)*43758.5453;
  return n-Math.floor(n);
}
function smoothNoise(x,y,seed){
  const ix=Math.floor(x),iy=Math.floor(y);
  const fx=x-ix,fy=y-iy;
  const v00=noise2D(ix,iy,seed);
  const v10=noise2D(ix+1,iy,seed);
  const v01=noise2D(ix,iy+1,seed);
  const v11=noise2D(ix+1,iy+1,seed);
  const sx=fx*fx*(3-2*fx),sy=fy*fy*(3-2*fy);
  const a=v00*(1-sx)+v10*sx;
  const b=v01*(1-sx)+v11*sx;
  return a*(1-sy)+b*sy;
}
function generateChunk(chunkX){
  const chunk=[];
  for(let y=0;y<CHUNK_H;y++){chunk[y]=[];for(let x=0;x<CHUNK_W;x++)chunk[y][x]=BLOCK.AIR;}
  for(let x=0;x<CHUNK_W;x++){
    const worldX=chunkX*CHUNK_W+x;
    const surfaceY=getSurfaceHeight(worldX);
    for(let y=surfaceY;y<CHUNK_H;y++){
      if(y===surfaceY){chunk[y][x]=BLOCK.GRASS;}
      else if(y<surfaceY+4)chunk[y][x]=BLOCK.DIRT;
      else if(y>CHUNK_H-4)chunk[y][x]=BLOCK.STONE;
      else{
        const r=seededRandom(worldX*1000+y*100+worldSeed);
        if(r<0.020)chunk[y][x]=BLOCK.COAL_ORE;
        else if(r<0.033)chunk[y][x]=BLOCK.GRAVEL;
        else if(r<0.043)chunk[y][x]=BLOCK.IRON_ORE;
        else if(r<0.048)chunk[y][x]=BLOCK.GOLD_ORE;
        else if(r<0.050)chunk[y][x]=BLOCK.DIAMOND_ORE;
        else chunk[y][x]=BLOCK.STONE;
      }
    }
    if(surfaceY>CHUNK_H-25&&surfaceY<CHUNK_H-15){
      chunk[surfaceY][x]=BLOCK.SAND;
      if(surfaceY+1<CHUNK_H)chunk[surfaceY+1][x]=BLOCK.SAND;
      if(surfaceY+2<CHUNK_H)chunk[surfaceY+2][x]=BLOCK.SAND;
    }
    chunk[CHUNK_H-1][x]=BLOCK.BEDROCK;
    chunk[CHUNK_H-2][x]=BLOCK.BEDROCK;
  }
  for(let x=2;x<CHUNK_W-2;x++){
    const worldX=chunkX*CHUNK_W+x;
    const surfaceY=getSurfaceHeight(worldX);
    const r=seededRandom(worldX*12345+worldSeed);
    if(r<0.10&&surfaceY>20){
      const treeH=4+Math.floor(seededRandom(worldX*999+worldSeed)*3);
      for(let i=1;i<=treeH;i++)if(surfaceY-i>=0)chunk[surfaceY-i][x]=BLOCK.LOG;
      const leafTop=surfaceY-treeH-1;
      for(let dy=-1;dy<=1;dy++)for(let dx=-2;dx<=2;dx++){
        const lx=x+dx,ly=leafTop+dy;
        if(lx>=0&&lx<CHUNK_W&&ly>=0&&ly<CHUNK_H){
          if(Math.abs(dx)===2&&dy!==0)continue;
          if(chunk[ly][lx]===BLOCK.AIR)chunk[ly][lx]=BLOCK.LEAVES;
        }
      }
      if(leafTop-1>=0)for(let dx=-1;dx<=1;dx++){
        const lx=x+dx;
        if(lx>=0&&lx<CHUNK_W&&chunk[leafTop-1][lx]===BLOCK.AIR)chunk[leafTop-1][lx]=BLOCK.LEAVES;
      }
    }
  }
  for(let x=0;x<CHUNK_W;x++){
    const worldX=chunkX*CHUNK_W+x;
    const surfaceY=getSurfaceHeight(worldX);
    for(let y=surfaceY+3;y<CHUNK_H-3;y++){
      const n=smoothNoise(worldX*0.15,y*0.15,worldSeed)*0.6
             +smoothNoise(worldX*0.35,y*0.35,worldSeed+1)*0.4;
      if(n>0.62&&chunk[y][x]!==BLOCK.AIR)chunk[y][x]=BLOCK.AIR;
      else if(n<0.20&&chunk[y][x]!==BLOCK.AIR&&y>CHUNK_H-100)chunk[y][x]=BLOCK.AIR;
    }
  }
  for(let x=0;x<CHUNK_W;x++){
    const surfaceY=getSurfaceHeight(chunkX*CHUNK_W+x);
    if(chunk[surfaceY][x]===BLOCK.AIR){
      if(surfaceY<CHUNK_H-1&&chunk[surfaceY+1][x]===BLOCK.AIR)chunk[surfaceY][x]=BLOCK.GRASS;
    }
  }
  return chunk;
}
function getChunk(chunkX){if(!chunks.has(chunkX))chunks.set(chunkX,generateChunk(chunkX));return chunks.get(chunkX);}
function getBlock(worldCol,worldRow){
  if(worldRow<0||worldRow>=CHUNK_H)return BLOCK.AIR;
  const key=worldCol+','+worldRow;
  if(blockChanges.has(key))return blockChanges.get(key);
  const chunkX=Math.floor(worldCol/CHUNK_W);
  const localX=worldCol-chunkX*CHUNK_W;
  return getChunk(chunkX)[worldRow][localX];
}
function setBlock(worldCol,worldRow,type){
  if(worldRow<0||worldRow>=CHUNK_H)return;
  blockChanges.set(worldCol+','+worldRow,type);
  const chunkX=Math.floor(worldCol/CHUNK_W);
  const localX=worldCol-chunkX*CHUNK_W;
  getChunk(chunkX)[worldRow][localX]=type;
  if(type===BLOCK.SAPLING)saplings.set(worldCol+','+worldRow,60*60*(3+Math.random()*4));
  else saplings.delete(worldCol+','+worldRow);
  if(type!==BLOCK.DOOR_LOWER&&type!==BLOCK.DOOR_UPPER)doorStates.delete(worldCol+','+worldRow);
  recomputeLightAround(worldCol,worldRow);
}
function getLight(x,y){return lightMap.get(x+','+y)||0;}
function recomputeLightAround(cx,cy){
  const radius=20;
  for(let dx=-radius;dx<=radius;dx++)for(let dy=-radius;dy<=radius;dy++){
    const x=cx+dx,y=cy+dy;if(y<0||y>=CHUNK_H)continue;lightMap.delete(x+','+y);
  }
  const queue=[];
  for(let dx=-radius;dx<=radius;dx++)for(let dy=-radius;dy<=radius;dy++){
    const x=cx+dx,y=cy+dy;if(y<0||y>=CHUNK_H)continue;
    const e=LIGHT_EMISSION[getBlock(x,y)]||0;if(e>0)queue.push({x,y,level:e});
  }
  while(queue.length>0){
    const{x,y,level}=queue.shift();
    if(level<=0)continue;
    if(level<=(lightMap.get(x+','+y)||0))continue;
    lightMap.set(x+','+y,level);
    for(const[ddx,ddy]of[[1,0],[-1,0],[0,1],[0,-1]]){
      const nx=x+ddx,ny=y+ddy;if(ny<0||ny>=CHUNK_H)continue;
      if(OPAQUE_BLOCKS.has(getBlock(nx,ny)))continue;
      queue.push({x:nx,y:ny,level:level-1});
    }
  }
}
function unloadFarChunks(){
  const pc=Math.floor(player.x/(CHUNK_W*TILE));
  for(const key of chunks.keys())if(Math.abs(key-pc)>8)chunks.delete(key);
}

function removeItem(t,c){let r=c;for(let i=0;i<INVENTORY_SIZE&&r>0;i++){const it=inventory[i];if(it&&it.type===t){const take=Math.min(it.count,r);it.count-=take;r-=take;if(it.count<=0)inventory[i]=null;}}return r===0;}
function addItemToInventory(t,c){
  let r=c;
  for(let i=0;i<INVENTORY_SIZE&&r>0;i++){const it=inventory[i];if(it&&it.type===t&&it.count<64){const add=Math.min(64-it.count,r);it.count+=add;r-=add;}}
  for(let i=0;i<INVENTORY_SIZE&&r>0;i++){if(!inventory[i]){const add=Math.min(64,r);inventory[i]={type:t,count:add};r-=add;}}
  return r===0;
}
function addItemToInventoryWithDur(t,c,dur,maxDur){
  let r=c;
  while(r>0){
    let placed=false;
    for(let i=0;i<INVENTORY_SIZE;i++){
      if(!inventory[i]){inventory[i]={type:t,count:1,durability:dur,maxDurability:maxDur};r--;placed=true;break;}
    }
    if(!placed)break;
  }
  return r===0;
}

function doCraft(r){

    if(i.altType){const need=i.count;const hm=countItem(i.type);const tm=Math.min(hm,need);if(tm>0)removeItem(i.type,tm);const rem=need-tm;if(rem>0)removeItem(i.altType,rem);}
    else removeItem(i.type,i.count);

  if(r.tool){

function throwItemStackToWorld(type,count){

  const dir=player.facing;
  const px=player.x+player.w/2;
  const py=player.y+player.h*0.3;
  let remaining=count;
  while(remaining>0){
    const c=Math.min(remaining,64);
    drops.push({
      x:px+dir*22+(Math.random()-0.5)*12,
      y:py+(Math.random()-0.5)*12,
      vx:dir*(3.5+Math.random()*2.5)+(Math.random()-0.5)*1.5,
      vy:-4-Math.random()*2,
      type:type,count:c,age:0,onGround:false,pickupDelay:100

  }
  playThrowSound();
}
function isArmorForSlot(type,slotIndex){
  const helms=[ITEM.LEATHER_HELMET,ITEM.CHAINMAIL_HELMET,ITEM.IRON_HELMET,ITEM.GOLDEN_HELMET,ITEM.DIAMOND_HELMET];
  const chests=[ITEM.LEATHER_CHESTPLATE,ITEM.CHAINMAIL_CHESTPLATE,ITEM.IRON_CHESTPLATE,ITEM.GOLDEN_CHESTPLATE,ITEM.DIAMOND_CHESTPLATE];
  const legs=[ITEM.LEATHER_LEGGINGS,ITEM.CHAINMAIL_LEGGINGS,ITEM.IRON_LEGGINGS,ITEM.GOLDEN_LEGGINGS,ITEM.DIAMOND_LEGGINGS];
  const boots=[ITEM.LEATHER_BOOTS,ITEM.CHAINMAIL_BOOTS,ITEM.IRON_BOOTS,ITEM.GOLDEN_BOOTS,ITEM.DIAMOND_BOOTS];
  if(slotIndex===0)return helms.includes(type);
  if(slotIndex===1)return chests.includes(type);
  if(slotIndex===2)return legs.includes(type);
  if(slotIndex===3)return boots.includes(type);
  return false;
}
function finishDrag(mx,my){
  if(!dragging)return;
  let item=dragging.item;
  const srcRef=dragging.ref;
  const ref=getSlotRefAtPoint(mx,my);
  const src=getSlotArrayAndIndex(srcRef);
  if(ref){
    const ai=getSlotArrayAndIndex(ref);
    if(ai){
      const ti=ai.arr[ai.idx];
      if(ref.kind==='armor'&&!isArmorForSlot(item.type,ref.index)){
        if(src)src.arr[src.idx]=item;
        dragging=null;return;
      }
      if(ti&&ti.type===item.type&&ref.kind!=='armor'&&item.durability===undefined&&ti.durability===undefined){
        const total=ti.count+item.count;
        if(total<=64){ti.count=total;item=null;}
        else{ti.count=64;item.count=total-64;}
      }else{
        ai.arr[ai.idx]=item;
        if(ti){if(src)src.arr[src.idx]=ti;else addItemToInventory(ti.type,ti.count);}
        item=null;
      }
    }
  }
  if(item)throwItemStackToWorld(item.type,item.count);
  dragging=null;
}
function startSplitMode(ref,touchId,startX,startY){

}
function cancelSplit(){if(splitMode)splitMode=null;}
function executeSplit(){
  if(!splitMode)return;
  const sm=splitMode;
  splitMode=null;
  const ai=getSlotArrayAndIndex(sm.ref);
  if(!ai||!ai.arr[sm.ref.index])return;
  const it=ai.arr[sm.ref.index];
  const total=it.count;
  const pct=Math.max(0,Math.min(100,sm.progress));
  let throwCount=Math.round(total*pct/100);
  if(throwCount<0)throwCount=0;
  if(throwCount>total)throwCount=total;
  const keep=total-throwCount;
  if(keep<=0)ai.arr[sm.ref.index]=null;else it.count=keep;
  if(throwCount>0)throwItemStackToWorld(it.type,throwCount);
}

}

function getRenderSliderRect(){

function getRippleSizeFromX(mx){

function getKeyboardMetrics(){
  const pad=6;const G=3;const topBarH=24;const unitCount=15;
  const availW=Math.max(120,canvas.width-8);
  const maxUnitW=Math.max(8,Math.floor((availW-2*pad-(unitCount-1)*G)/unitCount));
  const baseUnitW=Math.min(30,maxUnitW);
  let unitW=Math.round(baseUnitW*virtualKeyboard.scale);
  unitW=Math.max(8,Math.min(maxUnitW,unitW));
  const keyH=Math.max(16,Math.min(56,Math.round(34*virtualKeyboard.scale)));
  const totalW=unitCount*unitW+(unitCount-1)*G+2*pad;
  const totalH=topBarH+pad+KEY_ROWS.length*keyH+(KEY_ROWS.length-1)*G+pad;
  return{pad,G,topBarH,keyH,unitW,width:totalW,height:totalH};
}
function updateKeyboardAnimation(){
  if(virtualKeyboard.animProgress<virtualKeyboard.animTarget){
    virtualKeyboard.animProgress=Math.min(virtualKeyboard.animTarget,virtualKeyboard.animProgress+KEYBOARD_ANIM_SPEED);
  }else if(virtualKeyboard.animProgress>virtualKeyboard.animTarget){
    virtualKeyboard.animProgress=Math.max(virtualKeyboard.animTarget,virtualKeyboard.animProgress-KEYBOARD_ANIM_SPEED);
  }
  if(virtualKeyboard.animProgress<=0.001&&virtualKeyboard.animTarget===0){
    virtualKeyboard.animProgress=0;
    virtualKeyboard.visible=false;
  }
  const travel=Math.max(canvas.width,320)-virtualKeyboard.x+40;
  const eased=easeOutCubic(virtualKeyboard.animProgress);
  virtualKeyboard.animOffsetX=(1-eased)*travel;
}
function getSliderRect(){
  const m=getKeyboardMetrics();
  const kx=virtualKeyboard.x+virtualKeyboard.animOffsetX,ky=virtualKeyboard.y,kw=m.width;
  const left=kx+42;
  const right=kx+kw-34;
  const w=Math.max(30,right-left);
  const trackH=6;
  const y=ky+m.topBarH/2-trackH/2;
  return{x:left,y,w,h:trackH};
}
function beginSliderDrag(mx,touchId){
  const m=getKeyboardMetrics();
  const kx=virtualKeyboard.x+virtualKeyboard.animOffsetX,kw=m.width;
  const left=kx+42;
  const trackW=Math.max(30,(kx+kw-34)-left);
  virtualKeyboard.sliderDragging=true;
  virtualKeyboard.sliderTouchId=touchId;
  virtualKeyboard.sliderTrackLeft=left;
  virtualKeyboard.sliderTrackW=trackW;
  updateSliderFromX(mx);
}
function endSliderDrag(){
  virtualKeyboard.sliderDragging=false;
  virtualKeyboard.sliderTouchId=null;
  virtualKeyboard.sliderTrackLeft=0;
  virtualKeyboard.sliderTrackW=0;
}
function updateSliderFromX(mx){
  const left=virtualKeyboard.sliderTrackLeft;
  const trackW=virtualKeyboard.sliderTrackW||1;
  let t=(mx-left)/trackW;
  t=Math.max(0,Math.min(1,t));
  virtualKeyboard.scale=KEYBOARD_MIN_SCALE+t*(KEYBOARD_MAX_SCALE-KEYBOARD_MIN_SCALE);
  const m2=getKeyboardMetrics();
  virtualKeyboard.w=m2.width;
  virtualKeyboard.h=m2.height;
  if(virtualKeyboard.x+m2.width>canvas.width-4)virtualKeyboard.x=Math.max(0,canvas.width-4-m2.width);
  if(virtualKeyboard.y+m2.height>canvas.height-4)virtualKeyboard.y=Math.max(0,canvas.height-4-m2.height);
}
function getEffectiveKey(label){
  const mapping=KEY_MAP[label];
  if(!mapping)return label;
  const shiftKey=virtualKeyboard.pressedLabels.has('ShiftL')||virtualKeyboard.pressedLabels.has('ShiftR');
  const caps=virtualKeyboard.capsLock;
  if(/^[a-z]$/.test(label)){
    const isUpper=shiftKey!==caps;
    return isUpper?label.toUpperCase():label;
  }
  if(shiftKey&&mapping.shiftKey)return mapping.shiftKey;
  return mapping.key;
}
function dispatchVirtualKey(type,label,isRepeat){
  const mapping=KEY_MAP[label];
  if(!mapping)return;
  const shiftKey=virtualKeyboard.pressedLabels.has('ShiftL')||virtualKeyboard.pressedLabels.has('ShiftR');
  const ctrlKey=virtualKeyboard.pressedLabels.has('CtrlL')||virtualKeyboard.pressedLabels.has('CtrlR');
  const altKey=virtualKeyboard.pressedLabels.has('AltL')||virtualKeyboard.pressedLabels.has('AltR');
  let ev;
  try{
    ev=new KeyboardEvent(type,{
      key:getEffectiveKey(label),
      code:mapping.code,
      keyCode:mapping.keyCode,
      which:mapping.keyCode,
      shiftKey:shiftKey,
      ctrlKey:ctrlKey,
      altKey:altKey,
      metaKey:false,
      repeat:!!isRepeat,
      bubbles:true,
      cancelable:true,
    });
  }catch(e){
    ev=document.createEvent('KeyboardEvent');
    ev.initKeyboardEvent(type,true,true,window,getEffectiveKey(label),0,'',!!isRepeat,'');
  }
  document.dispatchEvent(ev);
}
function startKeyRepeat(label){
  stopKeyRepeat(label);
  const delay=setTimeout(()=>{
    const interval=setInterval(()=>{
      if(!virtualKeyboard.pressedLabels.has(label)){clearInterval(interval);virtualKeyboard.repeatIntervals.delete(label);return;}
      dispatchVirtualKey('keydown',label,true);
    },50);
    virtualKeyboard.repeatIntervals.set(label,interval);
  },500);
  virtualKeyboard.repeatDelays.set(label,delay);
}
function stopKeyRepeat(label){
  const d=virtualKeyboard.repeatDelays.get(label);
  if(d){clearTimeout(d);virtualKeyboard.repeatDelays.delete(label);}
  const i=virtualKeyboard.repeatIntervals.get(label);
  if(i){clearInterval(i);virtualKeyboard.repeatIntervals.delete(label);}
}
function virtualKeyPress(label,touchId){
  if(virtualKeyboard.touchToKey.get(touchId)===label)return;
  const prevLabel=virtualKeyboard.touchToKey.get(touchId);
  if(prevLabel)virtualKeyRelease(touchId);
  virtualKeyboard.touchToKey.set(touchId,label);
  virtualKeyboard.pressedLabels.add(label);
  const mapping=KEY_MAP[label];
  if(mapping&&mapping.isToggle){virtualKeyboard.capsLock=!virtualKeyboard.capsLock;}
  dispatchVirtualKey('keydown',label,false);
  if(mapping&&!mapping.noRepeat){startKeyRepeat(label);}
}
function virtualKeyRelease(touchId){
  const label=virtualKeyboard.touchToKey.get(touchId);
  if(!label)return;
  virtualKeyboard.touchToKey.delete(touchId);
  let stillPressed=false;
  for(const l of virtualKeyboard.touchToKey.values()){if(l===label){stillPressed=true;break;}}
  if(!stillPressed){
    dispatchVirtualKey('keyup',label,false);
    virtualKeyboard.pressedLabels.delete(label);
    stopKeyRepeat(label);
  }
}
function findKeyAtPoint(mx,my){
  const m=getKeyboardMetrics();
  const kx=virtualKeyboard.x+virtualKeyboard.animOffsetX,ky=virtualKeyboard.y;
  const kw=m.width;
  for(let r=0;r<KEY_ROWS.length;r++){
    const row=KEY_ROWS[r];
    let rowW=0;
    for(const k of row)rowW+=(k.u||1)*m.unitW;
    rowW+=(row.length-1)*m.G;
    let cx=kx+(kw-rowW)/2;
    const cy=ky+m.topBarH+m.pad+r*(m.keyH+m.G);
    for(const k of row){
      const w=(k.u||1)*m.unitW;
      if(mx>=cx&&mx<=cx+w&&my>=cy&&my<=cy+m.keyH)return k.c;
      cx+=w+m.G;
    }
  }
  return null;
}
function openVirtualKeyboard(){
  const m=getKeyboardMetrics();
  virtualKeyboard.visible=true;
  virtualKeyboard.w=m.width;
  virtualKeyboard.h=m.height;
  virtualKeyboard.x=Math.max(4,Math.min(canvas.width-m.width-4,(canvas.width-m.width)/2));
  virtualKeyboard.y=Math.max(4,canvas.height-m.height-10);
  virtualKeyboard.animTarget=1;
}
function closeVirtualKeyboard(){
  for(const touchId of Array.from(virtualKeyboard.touchToKey.keys())){virtualKeyRelease(touchId);}
  virtualKeyboard.animTarget=0;
  virtualKeyboard.dragging=false;
  virtualKeyboard.dragTouchId=null;
  virtualKeyboard.dragMouse=false;
  endSliderDrag();
}
function handleKeyboardTouchStart(mx,my,touchId){
  if(!virtualKeyboard.visible)return false;
  if(virtualKeyboard.animTarget!==1)return false;
  const m=getKeyboardMetrics();
  const kx=virtualKeyboard.x+virtualKeyboard.animOffsetX,ky=virtualKeyboard.y;
  const kw=m.width,kh=m.height;
  if(mx<kx||mx>kx+kw||my<ky||my>ky+kh)return false;
  if(mx>=kx+kw-30&&mx<=kx+kw-4&&my>=ky+2&&my<=ky+22){
    closeVirtualKeyboard();
    return true;
  }
  if(my>=ky+2&&my<=ky+m.topBarH-2){
    const sr=getSliderRect();
    if(mx>=sr.x-14&&mx<=sr.x+sr.w+14){
      beginSliderDrag(mx,touchId);
      return true;
    }
  }
  if(my<ky+m.topBarH){
    virtualKeyboard.dragging=true;
    virtualKeyboard.dragOffsetX=mx-kx;
    virtualKeyboard.dragOffsetY=my-ky;
    virtualKeyboard.dragTouchId=touchId;
    return true;
  }
  const label=findKeyAtPoint(mx,my);
  if(label){virtualKeyPress(label,touchId);return true;}
  return true;
}
function handleKeyboardTouchEnd(touchId){
  virtualKeyRelease(touchId);
  if(virtualKeyboard.sliderDragging&&virtualKeyboard.sliderTouchId===touchId){endSliderDrag();}
  if(virtualKeyboard.dragging&&virtualKeyboard.dragTouchId===touchId){
    virtualKeyboard.dragging=false;
    virtualKeyboard.dragTouchId=null;
  }
}
function handleKeyboardDrag(mx,my,touchId){
  if(virtualKeyboard.sliderDragging){
    if(touchId!==null&&virtualKeyboard.sliderTouchId!==touchId)return false;
    updateSliderFromX(mx);
    return true;
  }
  if(!virtualKeyboard.dragging)return false;
  if(virtualKeyboard.dragTouchId!==null&&virtualKeyboard.dragTouchId!==touchId)return false;
  const m=getKeyboardMetrics();
  const newX=mx-virtualKeyboard.dragOffsetX-virtualKeyboard.animOffsetX;
  virtualKeyboard.x=Math.max(0,Math.min(canvas.width-m.width,newX));
  virtualKeyboard.y=Math.max(0,Math.min(canvas.height-m.height,my-virtualKeyboard.dragOffsetY));
  return true;
}
function drawVirtualKeyboard(){
  if(!virtualKeyboard.visible)return;
  const m=getKeyboardMetrics();
  virtualKeyboard.w=m.width;virtualKeyboard.h=m.height;
  const kx=virtualKeyboard.x+virtualKeyboard.animOffsetX,ky=virtualKeyboard.y;
  const kw=m.width,kh=m.height;
  ctx.save();
  ctx.shadowColor='rgba(0,0,0,0.65)';
  ctx.shadowBlur=14;ctx.shadowOffsetY=5;
  ctx.fillStyle='rgba(25,25,45,0.97)';
  ctx.fillRect(kx,ky,kw,kh);
  ctx.shadowColor='transparent';ctx.shadowBlur=0;ctx.shadowOffsetY=0;
  ctx.strokeStyle='#8a8aaa';ctx.lineWidth=2;
  ctx.strokeRect(kx,ky,kw,kh);
  ctx.fillStyle='rgba(70,70,100,0.98)';
  ctx.fillRect(kx,ky,kw,m.topBarH);
  ctx.strokeStyle='rgba(138,138,170,0.6)';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(kx,ky+m.topBarH);ctx.lineTo(kx+kw,ky+m.topBarH);ctx.stroke();
  ctx.fillStyle='#fff';ctx.font='bold 13px '+FONT;
  ctx.textAlign='left';ctx.textBaseline='middle';
  ctx.fillText('键盘',kx+8,ky+m.topBarH/2);
  const sr=getSliderRect();
  const tScale=(virtualKeyboard.scale-KEYBOARD_MIN_SCALE)/(KEYBOARD_MAX_SCALE-KEYBOARD_MIN_SCALE);
  ctx.fillStyle='rgba(12,12,26,0.95)';
  ctx.fillRect(sr.x,sr.y,sr.w,sr.h);
  ctx.fillStyle='rgba(90,140,220,0.9)';
  ctx.fillRect(sr.x,sr.y,sr.w*tScale,sr.h);
  ctx.strokeStyle='rgba(160,160,200,0.85)';
  ctx.lineWidth=1;
  ctx.strokeRect(sr.x+0.5,sr.y+0.5,sr.w-1,sr.h-1);
  const hx=sr.x+sr.w*tScale;
  const hy=sr.y+sr.h/2;
  ctx.beginPath();
  ctx.arc(hx,hy,Math.max(5,sr.h),0,Math.PI*2);
  ctx.fillStyle='#cfd8ff';
  ctx.fill();
  ctx.strokeStyle='#5a7ac0';
  ctx.lineWidth=2;
  ctx.stroke();
  const closeX=kx+kw-28,closeY=ky+3,closeW=24,closeH=m.topBarH-6;
  ctx.fillStyle='#a04040';
  ctx.fillRect(closeX,closeY,closeW,closeH);
  ctx.strokeStyle='#f88';ctx.lineWidth=1;
  ctx.strokeRect(closeX,closeY,closeW,closeH);
  ctx.fillStyle='#fff';ctx.font='bold 16px '+FONT;
  ctx.textAlign='center';
  ctx.fillText('×',closeX+closeW/2,closeY+closeH/2);
  for(let r=0;r<KEY_ROWS.length;r++){
    const row=KEY_ROWS[r];
    let rowW=0;
    for(const k of row)rowW+=(k.u||1)*m.unitW;
    rowW+=(row.length-1)*m.G;
    let cx=kx+(kw-rowW)/2;
    const cy=ky+m.topBarH+m.pad+r*(m.keyH+m.G);
    for(const k of row){
      const w=(k.u||1)*m.unitW;
      const label=k.c;
      let pressed=false;
      for(const l of virtualKeyboard.touchToKey.values()){
        if(l===label){pressed=true;break;}
      }
      const isShift=label==='ShiftL'||label==='ShiftR';
      const isCtrl=label==='CtrlL'||label==='CtrlR';
      const isAlt=label==='AltL'||label==='AltR';
      const modifierActive=(isShift&&(virtualKeyboard.pressedLabels.has('ShiftL')||virtualKeyboard.pressedLabels.has('ShiftR')))
                       ||(isCtrl&&(virtualKeyboard.pressedLabels.has('CtrlL')||virtualKeyboard.pressedLabels.has('CtrlR')))
                       ||(isAlt&&(virtualKeyboard.pressedLabels.has('AltL')||virtualKeyboard.pressedLabels.has('AltR')))
                       ||(label==='Caps'&&virtualKeyboard.capsLock);
      let bgColor='#4a4a7a';
      if(label==='Enter')bgColor=pressed?'#5a9a5a':'#3a7a3a';
      else if(label==='Backspace')bgColor=pressed?'#9a5a5a':'#7a3a3a';
      else if(/^F\d+$/.test(label))bgColor=pressed?'#6a5a9a':'#3a3a5e';
      else if(modifierActive)bgColor=pressed?'#8a8aba':'#6a6a9a';
      else if(pressed)bgColor='#7a7aaa';
      ctx.fillStyle=bgColor;
      ctx.fillRect(cx,cy,w,m.keyH);
      ctx.strokeStyle='rgba(180,180,220,0.6)';ctx.lineWidth=1;
      ctx.strokeRect(cx,cy,w,m.keyH);
      let displayLabel=k.label||k.c;
      if(!k.label){
        if(/^[a-z]$/.test(k.c)){
          const shiftKey=virtualKeyboard.pressedLabels.has('ShiftL')||virtualKeyboard.pressedLabels.has('ShiftR');
          displayLabel=(shiftKey!==virtualKeyboard.capsLock)?k.c.toUpperCase():k.c;
        }else if((k.c==='ShiftL'||k.c==='ShiftR'))displayLabel='⇧';
        else if(k.c==='Caps')displayLabel='⇪';
      }
      ctx.fillStyle='#fff';
      let fs=14;
      if(k.c==='Space')fs=11;
      else if(k.c==='CtrlL'||k.c==='CtrlR'||k.c==='AltL'||k.c==='AltR'||k.c==='Caps')fs=11;
      else if(/^F\d+$/.test(k.c))fs=Math.max(8,Math.min(13,Math.floor(w/(k.c.length*0.78))));
      else if(displayLabel.length>1)fs=15;
      ctx.font='bold '+fs+'px '+FONT;
      ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText(displayLabel,cx+w/2,cy+m.keyH/2);
      cx+=w+m.G;
    }
  }
  ctx.restore();
}
document.addEventListener('keydown',e=>{
  const key=e.key.toLowerCase();
  keys[key]=true;
  if(e.key===' ')e.preventDefault();
  if(e.key==='Control')ctrlPressed=true;
  if(e.key==='F3'&&e.shiftKey&&keys['enter']){e.preventDefault();logVisible=!logVisible;return;}
  if(e.key==='F3'){e.preventDefault();return;}
  if(e.key==='F4'){e.preventDefault();if(virtualKeyboard.animTarget===1){closeVirtualKeyboard();}else{openVirtualKeyboard();}return;}
  if((e.ctrlKey||e.metaKey)&&key==='w')return;
  if(gameState==='menu'||gameState==='saves'||gameState==='createWorld'){
    if((e.ctrlKey||e.metaKey)&&key==='v')return;
    if(showNameEditor){
      if(e.key==='Enter'){if(nameInputText.trim().length>0){playerName=nameInputText.trim();localStorage.setItem('mc2d_name',playerName);}showNameEditor=false;return;}
      if(e.key==='Escape'){showNameEditor=false;return;}
      if(e.key==='Backspace'){nameInputText=nameInputText.slice(0,-1);e.preventDefault();return;}
      if(e.key.length===1&&!e.ctrlKey&&!e.metaKey&&nameInputText.length<16){if(e.key>=' '&&e.key<='~'||e.key.charCodeAt(0)>127)nameInputText+=e.key;}
      return;
    }
    if(gameState==='createWorld'){
      if(e.key==='Enter'){createWorldFromSeed();return;}
      if(e.key==='Escape'){gameState='saves';menuSlide=0;return;}
      if(e.key==='Backspace'){seedInputText=seedInputText.slice(0,-1);e.preventDefault();return;}
      if(e.key.length===1&&!e.ctrlKey&&!e.metaKey&&seedInputText.length<20){if(/[0-9\-]/.test(e.key))seedInputText+=e.key;}
      return;
    }
    if(gameState==='saves'){
      if(e.key==='Escape'){gameState='menu';menuSlide=0;return;}
      if(e.key==='Enter'){tryLoadSaveCode();return;}
      if(e.key==='Backspace'){saveCodeInputText=saveCodeInputText.slice(0,-1);e.preventDefault();return;}
      if(e.key.length===1&&!e.ctrlKey&&!e.metaKey)saveCodeInputText+=e.key;
      return;
    }
    if(showOptionsMenu){if(e.key==='Escape'||e.key==='Enter')showOptionsMenu=false;return;}
    if(e.key==='Enter'){const s=Math.floor(Math.random()*100000000000000)+1;startGameWithSeed(s);return;}
    return;
  }
  if(isLoading)return;
  if(gameState==='playing'){
    if(document.getElementById('saveOverlay').style.display==='flex')return;
    if(e.key==='Escape'){
      if(virtualKeyboard.animTarget===1){closeVirtualKeyboard();return;}
      if(showInventory||showCraftingTable||showFurnace||showChest){closeChest();cancelSplit();showInventory=false;showCraftingTable=false;showFurnace=false;resetGuiScroll();return;}
      if(showInGameMenu){if(showOptionsMenu){showOptionsMenu=false;return;}showInGameMenu=false;return;}
      showInGameMenu=true;showOptionsMenu=false;return;
    }
    if(showInGameMenu)return;
    if(key==='q'&&!e.repeat){if(showInventory||showCraftingTable||showFurnace||showChest)return;dropSelectedItem();return;}
    if(key==='e'&&!e.repeat){
      if(showInventory||showCraftingTable||showFurnace||showChest){closeChest();cancelSplit();showInventory=false;showCraftingTable=false;showFurnace=false;resetGuiScroll();}
      else{showInventory=true;resetGuiScroll();}
    }

function getViewRect(){

  const viewTop=camera.y+(canvas.height-viewH)/2;

function screenToWorld(mx,my){

function isFunctionalBlock(b){
  return b===BLOCK.CRAFTING||b===BLOCK.FURNACE||b===BLOCK.LIT_FURNACE||b===BLOCK.BED||b===BLOCK.DOOR_LOWER||b===BLOCK.DOOR_UPPER||b===BLOCK.CHEST;
}
function isWithinReach(worldCol,worldRow){
  const px=Math.floor((player.x+player.w/2)/TILE);
  const py=Math.floor((player.y+player.h/2)/TILE);
  const dx=worldCol-px,dy=worldRow-py;
  return Math.abs(dx)<=BLOCK_REACH&&Math.abs(dy)<=BLOCK_REACH;
}
function hasLineOfSight(worldCol,worldRow){
  const px=player.x+player.w/2,py=player.y+player.h/2;
  const tx=worldCol*TILE+TILE/2,ty=worldRow*TILE+TILE/2;
  const steps=Math.max(Math.abs(tx-px),Math.abs(ty-py))/TILE*2;
  for(let i=1;i<steps;i++){
    const t=i/steps;
    const sx=px+(tx-px)*t,sy=py+(ty-py)*t;
    const bx=Math.floor(sx/TILE),by=Math.floor(sy/TILE);
    if(bx===worldCol&&by===worldRow)continue;
    const b=getBlock(bx,by);
    if(b!==BLOCK.AIR&&b!==BLOCK.GLASS&&b!==BLOCK.TORCH&&b!==BLOCK.LADDER&&b!==BLOCK.SAPLING)return false;
  }
  return true;
}
function canInteractBlock(worldCol,worldRow){
  return isWithinReach(worldCol,worldRow)&&hasLineOfSight(worldCol,worldRow);
}

function breakBlockAt(worldCol,worldRow){
  const block=getBlock(worldCol,worldRow);
  if(block===BLOCK.AIR||block===BLOCK.BEDROCK||block===BLOCK.DOOR_UPPER)return;
  if(!canInteractBlock(worldCol,worldRow))return;
  const overlap=player.x+player.w>worldCol*TILE&&player.x<worldCol*TILE+TILE&&player.y+player.h>worldRow*TILE&&player.y<worldRow*TILE+TILE;
  if(overlap)return;
  if(block===BLOCK.CHEST){
    if(showChest&&openChestX===worldCol&&openChestY===worldRow)closeChest();
    dropChestContents(worldCol,worldRow);
  }
  setBlock(worldCol,worldRow,BLOCK.AIR);
  playBreakSound();
  if(block===BLOCK.LEAVES){
    if(Math.random()<0.25)spawnDrop(worldCol,worldRow,ITEM.SAPLING,1);
    if(Math.random()<0.10)spawnDrop(worldCol,worldRow,ITEM.STICK,1);
    if(Math.random()<0.05)spawnDrop(worldCol,worldRow,ITEM.APPLE,1);
  }else if(block===BLOCK.DOOR_LOWER){setBlock(worldCol,worldRow-1,BLOCK.AIR);spawnDrop(worldCol,worldRow,ITEM.DOOR,1);}
  else if(block===BLOCK.GRAVEL){
    if(Math.random()<0.10){
      spawnDrop(worldCol,worldRow,ITEM.FLINT,1);
    }else{
      spawnDrop(worldCol,worldRow,ITEM.BLOCK_GRAVEL,1);
    }
  }else if(block===BLOCK.DIAMOND_ORE){
    spawnDrop(worldCol,worldRow,ITEM.DIAMOND,1);
  }else if(block===BLOCK.COAL_ORE){spawnDrop(worldCol,worldRow,ITEM.COAL,1);}
  else if(block===BLOCK.IRON_ORE){spawnDrop(worldCol,worldRow,ITEM.RAW_IRON,1);}
  else if(block===BLOCK.GOLD_ORE){spawnDrop(worldCol,worldRow,ITEM.RAW_GOLD,1);}
  else{
    const di=BLOCK_TO_ITEM[block];
    if(di!==undefined&&di!==null)spawnDrop(worldCol,worldRow,di,1);
  }
}

function isInAttackRange(target){

  const tx=target.x+target.w/2,ty=target.y+target.h/2;
  const dx=px-tx,dy=py-ty;
  return(dx*dx+dy*dy)<=ATTACK_RANGE*ATTACK_RANGE;
}
function hasLineOfSightEntity(target){
  const px=player.x+player.w/2,py=player.y+player.h/2;
  const tx=target.x+target.w/2,ty=target.y+target.h/2;
  const steps=Math.max(Math.abs(tx-px),Math.abs(ty-py))/TILE*2;
  for(let i=1;i<steps;i++){
    const t=i/steps;
    const sx=px+(tx-px)*t,sy=py+(ty-py)*t;
    const bx=Math.floor(sx/TILE),by=Math.floor(sy/TILE);
    const b=getBlock(bx,by);

function phoneWorldDown(mx,my){
  const wp=screenToWorld(mx,my);
  const wx=wp.x,wy=wp.y;
  for(const a of animals){
    if(wx>=a.x&&wx<=a.x+a.w&&wy>=a.y&&wy<=a.y+a.h){
      if(!isInAttackRange(a)||!hasLineOfSightEntity(a))return;
      a.health-=getSelectedAttackDamage();
      a.hurtTimer=10;
      playBreakSound();
      useDurability(selectedSlot);
      return;
    }
  }
  for(const m of monsters){
    if(wx>=m.x&&wx<=m.x+m.w&&wy>=m.y&&wy<=m.y+m.h){
      if(!isInAttackRange(m)||!hasLineOfSightEntity(m))return;
      m.health-=getSelectedAttackDamage();
      m.hurtTimer=10;
      playBreakSound();
      useDurability(selectedSlot);
      return;
    }
  }
  const worldCol=Math.floor(wx/TILE);
  const worldRow=Math.floor(wy/TILE);
  const block=getBlock(worldCol,worldRow);
  const overlap=player.x+player.w>worldCol*TILE&&player.x<worldCol*TILE+TILE&&player.y+player.h>worldRow*TILE&&player.y<worldRow*TILE+TILE;
  if(block!==BLOCK.AIR){
    if(overlap)return;
    if(block===BLOCK.BEDROCK)return;
    if(block===BLOCK.DOOR_UPPER)return;
    if(!canInteractBlock(worldCol,worldRow))return;
    if(isFunctionalBlock(block)){
      const touchYInTile=wy-worldRow*TILE;
      if(touchYInTile<TILE/2){breakBlockAt(worldCol,worldRow);}
      else{interactFunctionalBlock(worldCol,worldRow);}
    }else{breakBlockAt(worldCol,worldRow);}
    return;
  }
  if(overlap)return;
  const item=inventory[selectedSlot];
  if(!item)return;
  if(item.type===ITEM.APPLE||item.type===ITEM.RAW_MUTTON||item.type===ITEM.COOKED_MUTTON||
     item.type===ITEM.RAW_CHICKEN||item.type===ITEM.COOKED_CHICKEN||item.type===ITEM.ROTTEN_FLESH||
     item.type===ITEM.RAW_BEEF||item.type===ITEM.COOKED_BEEF){
    let heal=item.type===ITEM.APPLE?4:
      ((item.type===ITEM.RAW_MUTTON||item.type===ITEM.RAW_CHICKEN||item.type===ITEM.RAW_BEEF)?2:
       (item.type===ITEM.ROTTEN_FLESH?1:6));
    player.health=Math.min(player.maxHealth,player.health+heal);
    item.count--;
    if(item.count<=0)inventory[selectedSlot]=null;
    return;
  }
  const pb=ITEM_TO_BLOCK[item.type];
  if(pb===undefined)return;
  if(!canInteractBlock(worldCol,worldRow))return;
  if(pb===BLOCK.DOOR_LOWER){
    if(getBlock(worldCol,worldRow-1)!==BLOCK.AIR)return;
    setBlock(worldCol,worldRow,BLOCK.DOOR_LOWER);
    setBlock(worldCol,worldRow-1,BLOCK.DOOR_UPPER);
    doorStates.set(worldCol+','+worldRow,false);
  }else{setBlock(worldCol,worldRow,pb);}
  playPlaceSound();
  if(pb===BLOCK.SAND||pb===BLOCK.GRAVEL){
    const below=getBlock(worldCol,worldRow+1);
    if(below===BLOCK.AIR||below===BLOCK.TORCH){
      setBlock(worldCol,worldRow,BLOCK.AIR);
      fallingBlocks.push({x:worldCol*TILE+TILE/2,y:worldRow*TILE,vy:0,type:pb});
    }
  }
  item.count--;
  if(item.count<=0)inventory[selectedSlot]=null;
}

        if(saplings.has(key)&&Math.random()<0.30){growTree(worldCol,worldRow);saplings.delete(key);}
        it.count--;if(it.count<=0)inventory[selectedSlot]=null;
        playPlaceSound();
        return;
      }
    }
    if(block===BLOCK.AIR&&!overlap){
      const it=inventory[selectedSlot];
      if(!it)return;
      if(it.type===ITEM.APPLE||it.type===ITEM.RAW_MUTTON||it.type===ITEM.COOKED_MUTTON||
         it.type===ITEM.RAW_CHICKEN||it.type===ITEM.COOKED_CHICKEN||it.type===ITEM.ROTTEN_FLESH||
         it.type===ITEM.RAW_BEEF||it.type===ITEM.COOKED_BEEF){
        let heal=it.type===ITEM.APPLE?4:
          ((it.type===ITEM.RAW_MUTTON||it.type===ITEM.RAW_CHICKEN||it.type===ITEM.RAW_BEEF)?2:
           (it.type===ITEM.ROTTEN_FLESH?1:6));
        player.health=Math.min(player.maxHealth,player.health+heal);
        it.count--;
        if(it.count<=0)inventory[selectedSlot]=null;
        return;
      }
      const pb=ITEM_TO_BLOCK[it.type];
      if(pb!==undefined){
        if(!canInteractBlock(worldCol,worldRow))return;
        if(pb===BLOCK.DOOR_LOWER){
          if(getBlock(worldCol,worldRow-1)!==BLOCK.AIR)return;
          setBlock(worldCol,worldRow,BLOCK.DOOR_LOWER);
          setBlock(worldCol,worldRow-1,BLOCK.DOOR_UPPER);
          doorStates.set(worldCol+','+worldRow,false);
        }else setBlock(worldCol,worldRow,pb);
        playPlaceSound();
        if(pb===BLOCK.SAND||pb===BLOCK.GRAVEL){
          const below=getBlock(worldCol,worldRow+1);
          if(below===BLOCK.AIR||below===BLOCK.TORCH){
            setBlock(worldCol,worldRow,BLOCK.AIR);
            fallingBlocks.push({x:worldCol*TILE+TILE/2,y:worldRow*TILE,vy:0,type:pb});
          }
        }
        it.count--;
        if(it.count<=0)inventory[selectedSlot]=null;
      }
    }
  }
});

function hasArrowInInventory(){
  for(let i=0;i<INVENTORY_SIZE;i++){const it=inventory[i];if(it&&it.type===ITEM.ARROW&&it.count>0)return true;}
  return false;
}
function consumeOneArrow(){
  for(let i=0;i<INVENTORY_SIZE;i++){
    const it=inventory[i];
    if(it&&it.type===ITEM.ARROW&&it.count>0){it.count--;if(it.count<=0)inventory[i]=null;return true;}
  }
  return false;
}
function fireArrow(){
  const item=inventory[selectedSlot];
  if(!item||item.type!==ITEM.BOW)return;
  if(!hasArrowInInventory())return;
  const t=Math.min(1,bowCharge/1000);
  const speed=6+t*14;
  const cx=player.x+player.w/2;
  const cy=player.y+player.h*0.4;
  let aimX=mouseWorldX,aimY=mouseWorldY;
  if(phoneMode){aimX=cx+player.facing*100;aimY=cy;}
  let dx=aimX-cx,dy=aimY-cy;
  let d=Math.sqrt(dx*dx+dy*dy);
  if(d<0.001){dx=player.facing;dy=0;d=1;}
  const nx=dx/d,ny=dy/d;
  if(!phoneMode)player.facing=nx>=0?1:-1;
  const px=cx+nx*12;
  const py=cy+ny*12;
  if(!consumeOneArrow())return;
  arrows.push({
    x:px,y:py,
    vx:nx*speed,
    vy:ny*speed,
    damage:speed*0.6,
    age:0,
    owner:'player'
  });
  playThrowSound();
  useDurability(selectedSlot);
}
function spawnSkeletonArrow(sx,sy,tx,ty){
  const dx=tx-sx,dy=ty-sy;
  const d=Math.sqrt(dx*dx+dy*dy)||1;
  arrows.push({
    x:sx,y:sy,
    vx:dx/d*SKELETON_ARROW_SPEED,
    vy:dy/d*SKELETON_ARROW_SPEED,
    damage:4,
    age:0,
    owner:'skeleton',
    homing:true
  });
}
function spawnArrowDrop(px,py){
  drops.push({
    x:px,y:py,
    vx:(Math.random()-0.5)*1.5,
    vy:-2-Math.random(),
    type:ITEM.ARROW,count:1,age:0,onGround:false,pickupDelay:20
  });
}
function updateArrows(){
  for(let i=arrows.length-1;i>=0;i--){
    const a=arrows[i];
    a.age++;
    a.x+=a.vx;a.y+=a.vy;
    if(a.homing){
      const px=player.x+player.w/2,py=player.y+player.h*0.4;
      const dx=px-a.x,dy=py-a.y;
      const d=Math.sqrt(dx*dx+dy*dy)||1;
      const tvx=dx/d*SKELETON_ARROW_SPEED;
      const tvy=dy/d*SKELETON_ARROW_SPEED;
      a.vx+=(tvx-a.vx)*0.06;
      a.vy+=(tvy-a.vy)*0.06;
      const v=Math.sqrt(a.vx*a.vx+a.vy*a.vy);
      if(v>SKELETON_ARROW_SPEED){a.vx=a.vx/v*SKELETON_ARROW_SPEED;a.vy=a.vy/v*SKELETON_ARROW_SPEED;}
    }else{
      a.vy+=GRAVITY*0.25;
      a.vx*=0.985;a.vy*=0.985;
    }
    const bx=Math.floor(a.x/TILE),by=Math.floor(a.y/TILE);
    let hitBlock=false;
    if(by>=0&&by<CHUNK_H){
      const b=getBlock(bx,by);
      if(b!==BLOCK.AIR&&b!==BLOCK.GLASS&&b!==BLOCK.TORCH&&b!==BLOCK.LADDER&&b!==BLOCK.SAPLING){
        hitBlock=true;
      }
    }
    let hitMob=null;
    if(a.owner==='player'){
      for(const m of monsters){
        if(a.x>=m.x&&a.x<=m.x+m.w&&a.y>=m.y&&a.y<=m.y+m.h){hitMob=m;break;}
      }
      if(!hitMob)for(const an of animals){
        if(a.x>=an.x&&a.x<=an.x+an.w&&a.y>=an.y&&a.y<=an.y+an.h){hitMob=an;break;}
      }
    }else{
      if(a.x>=player.x&&a.x<=player.x+player.w&&a.y>=player.y&&a.y<=player.y+player.h){
        const defense=getTotalArmorDefense();
        const dmg=Math.max(1,Math.round(a.damage*(1-defense*0.04)));
        player.health=Math.max(0,player.health-dmg);
        playHurtSound();
        if(player.health<=0){player.health=player.maxHealth;player.x=player.spawnX;player.y=player.spawnY;player.vy=0;}
        arrows.splice(i,1);continue;
      }
    }
    if(hitMob){
      const dmg=Math.max(1,Math.round(a.damage));
      hitMob.health-=dmg;
      if(hitMob.hurtTimer!==undefined)hitMob.hurtTimer=10;
      playHurtSound();
      if(a.owner==='player')spawnArrowDrop(a.x,a.y);
      arrows.splice(i,1);continue;
    }
    if(hitBlock){
      if(a.owner==='player')spawnArrowDrop(a.x,a.y);
      arrows.splice(i,1);continue;
    }
    if(a.age>240||(!a.homing&&Math.abs(a.vx)+Math.abs(a.vy)<0.5)){
      arrows.splice(i,1);continue;
    }
  }
}
function spawnDrop(wc,wr,t,c){
  if(t===null||t===undefined)return;
  drops.push({x:wc*TILE+TILE/2,y:wr*TILE+TILE/2,vx:(Math.random()-0.5)*2.5,vy:-3-Math.random()*1.5,type:t,count:c||1,age:0,onGround:false,pickupDelay:0});
}
function spawnAnimal(type,x,y){
  animals.push({type,x,y,vx:0,vy:0,w:TILE,h:TILE,health:10,maxHealth:10,onGround:false,facing:1,wanderTimer:0,wanderDir:0,age:0,hurtTimer:0});
}
function spawnMonster(type,x,y){
  if(type==='zombie'){
    monsters.push({type,x,y,vx:0,vy:0,w:TILE*0.75,h:TILE*2,health:20,maxHealth:20,onGround:false,facing:1,attackCooldown:0,hurtTimer:0,burnTimer:0});
  }else if(type==='spider'){
    monsters.push({type,x,y,vx:0,vy:0,w:TILE*1.4,h:TILE*0.9,health:16,maxHealth:16,onGround:false,facing:1,attackCooldown:0,hurtTimer:0,burnTimer:0});
  }else if(type==='skeleton'){
    monsters.push({type,x,y,vx:0,vy:0,w:TILE*0.75,h:TILE*2,health:20,maxHealth:20,onGround:false,facing:1,attackCooldown:0,hurtTimer:0,burnTimer:0,shootCooldown:60});
  }
}

function updateMonsters(){
  for(let i=monsters.length-1;i>=0;i--){
    const m=monsters[i];
    m.attackCooldown=Math.max(0,m.attackCooldown-1);
    if(m.hurtTimer>0)m.hurtTimer--;
    if(m.shootCooldown>0)m.shootCooldown--;
    if(!isNight&&(m.type==='zombie'||m.type==='skeleton')){
      const col=Math.floor((m.x+m.w/2)/TILE);
      let exposed=true;
      for(let row=Math.floor(m.y/TILE)-1;row>=0;row--){
        const b=getBlock(col,row);
        if(b!==BLOCK.AIR&&b!==BLOCK.GLASS&&b!==BLOCK.TORCH&&b!==BLOCK.LADDER&&b!==BLOCK.SAPLING&&b!==BLOCK.DOOR_LOWER&&b!==BLOCK.DOOR_UPPER&&b!==BLOCK.CHEST){exposed=false;break;}
      }
      if(exposed){
        m.burnTimer++;
        if(m.burnTimer>=60){m.burnTimer=0;m.health-=1;m.hurtTimer=10;}
      }else{m.burnTimer=0;}
    }else{m.burnTimer=0;}
    const dx=player.x-m.x,dy=player.y-m.y;
    const dist=Math.sqrt(dx*dx+dy*dy);
    let moveSpeed=m.type==='zombie'?0.5:(m.type==='spider'?0.8:0.5);
    if(m.type==='skeleton'){
      if(dist<480&&dist>60){
        m.vx=0;
        m.facing=dx>0?1:-1;
        if(m.shootCooldown<=0){
          spawnSkeletonArrow(m.x+m.w/2,m.y+m.h*0.4,player.x+player.w/2,player.y+player.h*0.4);
          m.shootCooldown=180;
        }
      }else if(dist>10&&dist<300){
        m.vx=Math.sign(dx)*moveSpeed;
        m.facing=m.vx>0?1:-1;
      }else{m.vx=0;}
    }else{
      if(dist<280&&dist>10){
        m.vx=Math.sign(dx)*moveSpeed;
        m.facing=m.vx>0?1:-1;
      }else{m.vx=0;}
    }
    m.x+=m.vx;
    let mblocks=getBlocksInRect(m.x,m.y,m.w,m.h);
    let horizontallyBlocked=false;
    for(const b of mblocks){
      if(m.vx>0){m.x=b.col*TILE-m.w;horizontallyBlocked=true;}
      else if(m.vx<0){m.x=b.col*TILE+TILE;horizontallyBlocked=true;}
    }
    if(m.type==='spider'&&horizontallyBlocked&&m.vy>=0&&dist<280&&dist>10){
      m.vy=-5.5;
    }
    if((m.type==='zombie'||m.type==='skeleton')&&horizontallyBlocked&&m.onGround&&dist<280&&dist>10){
      m.vy=-5.5;
    }
    m.vy=Math.min(m.vy+GRAVITY,12);m.y+=m.vy;
    m.onGround=false;
    mblocks=getBlocksInRect(m.x,m.y,m.w,m.h);
    for(const b of mblocks){if(m.vy>0){m.y=b.row*TILE-m.h;m.vy=0;m.onGround=true;}else if(m.vy<0){m.y=b.row*TILE+TILE;m.vy=0;}}
    const attackRange=m.type==='zombie'?TILE*0.8:(m.type==='spider'?TILE*1.2:0);
    if(m.type!=='skeleton'&&dist<attackRange&&m.attackCooldown<=0){
      const dmg=m.type==='zombie'?3:2;
      const defense=getTotalArmorDefense();
      const reduced=Math.max(1,Math.round(dmg*(1-defense*0.04)));
      player.health=Math.max(0,player.health-reduced);
      m.attackCooldown=40;
      playHurtSound();
      if(player.health<=0){player.health=player.maxHealth;player.x=player.spawnX;player.y=player.spawnY;player.vy=0;}
    }
    if(m.health<=0){
      const mx=Math.floor(m.x/TILE),my=Math.floor(m.y/TILE);
      if(m.type==='zombie'){spawnDrop(mx,my,ITEM.ROTTEN_FLESH,1+Math.floor(Math.random()*2));}
      else if(m.type==='spider'){
        spawnDrop(mx,my,ITEM.STRING,1+Math.floor(Math.random()*2));
        if(Math.random()<0.33)spawnDrop(mx,my,ITEM.SPIDER_EYE,1);
      }else if(m.type==='skeleton'){
        const arrowCount=Math.floor(Math.random()*4);
        if(arrowCount>0)spawnDrop(mx,my,ITEM.ARROW,arrowCount);
        const boneCount=1+Math.floor(Math.random()*3);
        spawnDrop(mx,my,ITEM.BONE,boneCount);
      }
      monsters.splice(i,1);
    }
  }
}
function updateMonsterSpawning(){
  monsterSpawnTimer++;
  if(monsterSpawnTimer<MONSTER_SPAWN_INTERVAL)return;
  monsterSpawnTimer=0;
  if(monsters.length>=MONSTER_MAX)return;
  for(let attempt=0;attempt<8;attempt++){
    const angle=Math.random()*Math.PI*2;
    const dist=10+Math.random()*(MONSTER_SPAWN_RADIUS-10);
    const targetX=Math.floor((player.x/TILE)+Math.cos(angle)*dist);
    const targetY=Math.floor((player.y/TILE)+Math.sin(angle)*dist);
    if(targetY<1||targetY>=CHUNK_H-2)continue;
    const groundBlock=getBlock(targetX,targetY+1);
    const space1=getBlock(targetX,targetY);
    const space2=getBlock(targetX,targetY-1);
    if(space1===BLOCK.AIR&&space2===BLOCK.AIR&&(groundBlock===BLOCK.GRASS||groundBlock===BLOCK.DIRT||groundBlock===BLOCK.STONE||groundBlock===BLOCK.COBBLE)){
      const blockLight=getLight(targetX,targetY);
      const envLight=dayLight*15;
      const finalLight=Math.max(blockLight,envLight);
      if(finalLight>7)continue;
      const dx=targetX*TILE-player.x,dy=targetY*TILE-player.y;
      if(dx*dx+dy*dy<4*TILE*4*TILE)continue;
      const r=Math.random();
      let type='zombie';
      if(r<0.4)type='zombie';else if(r<0.7)type='spider';else type='skeleton';
      spawnMonster(type,targetX*TILE,targetY*TILE);
      return;
    }
  }
}

function updateAnimals(){
  for(let i=animals.length-1;i>=0;i--){
    const a=animals[i];
    a.age++;a.wanderTimer--;
    if(a.hurtTimer>0)a.hurtTimer--;
    if(a.wanderTimer<=0){a.wanderTimer=60+Math.random()*120;a.wanderDir=Math.random()<0.5?-1:1;if(Math.random()<0.35)a.wanderDir=0;}
    a.vx=a.wanderDir*0.7;
    if(a.vx!==0)a.facing=a.vx>0?1:-1;
    a.x+=a.vx;
    let ablocks=getBlocksInRect(a.x,a.y,a.w,a.h);
    let hitWall=false;
    for(const b of ablocks){if(a.vx>0){a.x=b.col*TILE-a.w;a.wanderDir=-1;hitWall=true;}else if(a.vx<0){a.x=b.col*TILE+TILE;a.wanderDir=1;hitWall=true;}}
    if(hitWall&&a.onGround){a.vy=-5;}
    a.vy=Math.min(a.vy+GRAVITY,12);a.y+=a.vy;
    a.onGround=false;
    ablocks=getBlocksInRect(a.x,a.y,a.w,a.h);
    for(const b of ablocks){if(a.vy>0){a.y=b.row*TILE-a.h;a.vy=0;a.onGround=true;}else if(a.vy<0){a.y=b.row*TILE+TILE;a.vy=0;}}
    if(a.health<=0){
      const mx=Math.floor(a.x/TILE),my=Math.floor(a.y/TILE);
      if(a.type==='sheep'){
        spawnDrop(mx,my,ITEM.RAW_MUTTON,1);
        const w=1+Math.floor(Math.random()*3);
        spawnDrop(mx,my,ITEM.WOOL,w);
      }else if(a.type==='chicken'){
        spawnDrop(mx,my,ITEM.RAW_CHICKEN,1);
        spawnDrop(mx,my,ITEM.FEATHER,1+Math.floor(Math.random()*2));
      }else if(a.type==='cow'){
        spawnDrop(mx,my,ITEM.RAW_BEEF,1+Math.floor(Math.random()*2));
        spawnDrop(mx,my,ITEM.LEATHER,1+Math.floor(Math.random()*2));
      }
      animals.splice(i,1);
    }
  }
}
function updateAnimalSpawning(){
  animalSpawnTimer++;
  if(animalSpawnTimer<ANIMAL_SPAWN_INTERVAL)return;
  animalSpawnTimer=0;
  if(animals.length>=ANIMAL_MAX)return;
  for(let attempt=0;attempt<5;attempt++){
    const angle=Math.random()*Math.PI*2;
    const dist=8+Math.random()*(ANIMAL_SPAWN_RADIUS-8);
    const targetX=Math.floor((player.x/TILE)+Math.cos(angle)*dist);
    const targetY=Math.floor((player.y/TILE)+Math.sin(angle)*dist);
    const groundBlock=getBlock(targetX,targetY+1);
    const space1=getBlock(targetX,targetY);
    const space2=getBlock(targetX,targetY-1);
    if((groundBlock===BLOCK.GRASS||groundBlock===BLOCK.DIRT)&&space1===BLOCK.AIR&&space2===BLOCK.AIR){
      const dx=targetX*TILE-player.x,dy=targetY*TILE-player.y;
      if(dx*dx+dy*dy<6*TILE*6*TILE)continue;
      const r=Math.random();
      const type=r<0.4?'sheep':(r<0.75?'chicken':'cow');
      spawnAnimal(type,targetX*TILE,targetY*TILE);
      return;
    }
  }
}

function updateGrassSpread(){
  if(gameTime<nextGrassSpread)return;
  nextGrassSpread=gameTime+18000;
  const px=Math.floor((player.x+player.w/2)/TILE);
  const py=Math.floor((player.y+player.h/2)/TILE);
  const range=40;
  const candidates=[];
  for(let c=px-range;c<=px+range;c++){
    for(let r=py-range;r<=py+range;r++){
      if(r<1||r>=CHUNK_H-1)continue;
      if(getBlock(c,r)!==BLOCK.DIRT)continue;
      if(getBlock(c,r-1)!==BLOCK.AIR)continue;
      if(getBlock(c-1,r)===BLOCK.GRASS||getBlock(c+1,r)===BLOCK.GRASS||getBlock(c,r+1)===BLOCK.GRASS){
        candidates.push([c,r]);
      }
    }
  }
  if(candidates.length>0){
    const[c,r]=candidates[Math.floor(Math.random()*candidates.length)];
    setBlock(c,r,BLOCK.GRASS);
  }
}

/* 下落方块物理：下方是树苗时，沙子/沙砾直接变成掉落物，避免抖动 */
function updateFallingBlocks(){
  for(let i=fallingBlocks.length-1;i>=0;i--){
    const fb=fallingBlocks[i];
    fb.vy=Math.min(fb.vy+GRAVITY*0.8,14);
    fb.y+=fb.vy;
    const col=Math.floor(fb.x/TILE);
    const bottomRow=Math.floor((fb.y+TILE-0.01)/TILE);
    if(bottomRow>=0&&bottomRow<CHUNK_H){
      const below=getBlock(col,bottomRow);
      if(below!==BLOCK.AIR&&below!==BLOCK.GLASS){
        const targetRow=bottomRow-1;
        const occupied=getBlock(col,targetRow)!==BLOCK.AIR;
        /* 下方是树苗或目标格被占据：直接变成掉落物 */
        if(occupied||below===BLOCK.SAPLING){
          spawnDrop(col,targetRow,BLOCK_TO_ITEM[fb.type]||fb.type,1);
        }else{
          setBlock(col,targetRow,fb.type);
        }
        fallingBlocks.splice(i,1);
        continue;
      }
    }
    if(fb.y>CHUNK_H*TILE+100)fallingBlocks.splice(i,1);
  }
}
let gravelCheckTimer=0;
/* 沙砾/沙子自然下落检测：树苗不再作为穿透物，避免抖动死循环 */
function updateGravelPhysics(){
  gravelCheckTimer++;
  if(gravelCheckTimer<6)return;
  gravelCheckTimer=0;
  const px=Math.floor((player.x+player.w/2)/TILE);
  const range=24;
  for(let c=px-range;c<=px+range;c++){
    for(let r=CHUNK_H-2;r>=1;r--){
      const b=getBlock(c,r);
      if(b!==BLOCK.SAND&&b!==BLOCK.GRAVEL)continue;
      const below=getBlock(c,r+1);
      if(below===BLOCK.AIR||below===BLOCK.TORCH||below===BLOCK.LADDER){
        setBlock(c,r,BLOCK.AIR);
        fallingBlocks.push({x:c*TILE+TILE/2,y:r*TILE,vy:0,type:b});
      }
    }
  }
}

function updateSaplings(){
  for(const[k,fr]of saplings){
    const nf=fr-1;
    if(nf<=0){const[x,y]=k.split(',').map(Number);growTree(x,y);saplings.delete(k);}
    else saplings.set(k,nf);
  }
}
function growTree(x,y){
  const th=4+Math.floor(Math.random()*3);
  for(let dx=-2;dx<=2;dx++)for(let dy=-th-1;dy<=0;dy++){
    const bx=x+dx,by=y+dy;const b=getBlock(bx,by);
    if(b!==BLOCK.AIR&&b!==BLOCK.SAPLING){const d=BLOCK_TO_ITEM[b];if(d)spawnDrop(bx,by,d,1);}
  }
  for(let i=0;i<th;i++)setBlock(x,y-i,BLOCK.LOG);
  const lt=y-th-1;
  for(let dy=-1;dy<=1;dy++)for(let dx=-2;dx<=2;dx++){
    const lx=x+dx,ly=lt+dy;
    if(Math.abs(dx)===2&&dy!==0)continue;
    if(getBlock(lx,ly)===BLOCK.AIR)setBlock(lx,ly,BLOCK.LEAVES);
  }
  if(lt-1>=0)for(let dx=-1;dx<=1;dx++)if(getBlock(x+dx,lt-1)===BLOCK.AIR)setBlock(x+dx,lt-1,BLOCK.LEAVES);
}

function updateDrops(){
  for(let i=drops.length-1;i>=0;i--){
    const d=drops[i];
    d.age++;if(d.pickupDelay>0)d.pickupDelay--;
    d.vy+=GRAVITY*0.75;d.vy=Math.min(d.vy,12);
    d.x+=d.vx;d.y+=d.vy;d.vx*=0.94;
    if(Math.abs(d.vx)<0.05)d.vx=0;
    const cx=Math.floor(d.x/TILE),by=Math.floor((d.y+DROP_SIZE/2)/TILE);
    if(by>=0&&by<CHUNK_H){
      const below=getBlock(cx,by);
      if(below!==BLOCK.AIR&&below!==BLOCK.GLASS&&below!==BLOCK.TORCH&&below!==BLOCK.LADDER&&below!==BLOCK.SAPLING){d.y=by*TILE-DROP_SIZE/2;if(d.vy>0)d.vy=0;d.onGround=true;}
      else d.onGround=false;
    }
    const lx=Math.floor((d.x-DROP_SIZE/2)/TILE),rx=Math.floor((d.x+DROP_SIZE/2)/TILE),my=Math.floor(d.y/TILE);
    if(my>=0&&my<CHUNK_H){
      const bL=getBlock(lx,my);
      if(bL!==BLOCK.AIR&&bL!==BLOCK.GLASS){d.x=(lx+1)*TILE+DROP_SIZE/2;d.vx=0;}
      const bR=getBlock(rx,my);
      if(bR!==BLOCK.AIR&&bR!==BLOCK.GLASS){d.x=rx*TILE-DROP_SIZE/2;d.vx=0;}
    }
    if(d.pickupDelay<=0){
      const pr=8;
      if(d.x+DROP_SIZE/2+pr>player.x&&d.x-DROP_SIZE/2-pr<player.x+player.w&&d.y+DROP_SIZE/2+pr>player.y&&d.y-DROP_SIZE/2-pr<player.y+player.h){
        if(addItemToInventory(d.type,d.count||1)){drops.splice(i,1);continue;}
      }
    }
    if(d.age>DROP_MAX_AGE)drops.splice(i,1);
  }
}

function getBlocksInRect(px,py,pw,ph){
  const l=Math.floor(px/TILE),r=Math.floor((px+pw-0.01)/TILE);
  const t=Math.floor(py/TILE),b=Math.floor((py+ph-0.01)/TILE);
  const out=[];
  for(let y=t;y<=b;y++)for(let x=l;x<=r;x++){
    if(y<0||y>=CHUNK_H)continue;
    const bl=getBlock(x,y);
    if(bl===BLOCK.AIR||bl===BLOCK.GLASS||bl===BLOCK.TORCH||bl===BLOCK.LADDER||bl===BLOCK.SAPLING||bl===BLOCK.BED)continue;
    if(bl===BLOCK.DOOR_LOWER||bl===BLOCK.DOOR_UPPER){
      if(isDoorOpen(x,y))continue;
      out.push({row:y,col:x,type:bl});continue;
    }
    out.push({row:y,col:x,type:bl});
  }
  return out;
}
function isInLadder(px,py,pw,ph){
  const l=Math.floor(px/TILE),r=Math.floor((px+pw-0.01)/TILE);
  const t=Math.floor(py/TILE),b=Math.floor((py+ph-0.01)/TILE);
  for(let y=t;y<=b;y++)for(let x=l;x<=r;x++)if(getBlock(x,y)===BLOCK.LADDER)return true;
  return false;
}
function isSupportedAhead(dx){
  if(dx===0)return true;
  const footY=player.y+player.h+1;
  const newX=player.x+dx;
  const edgeX=dx>0?(newX+player.w-0.01):newX;
  const col=Math.floor(edgeX/TILE);
  const row=Math.floor(footY/TILE);
  if(row<0||row>=CHUNK_H)return false;
  const b=getBlock(col,row);
  return b!==BLOCK.AIR&&b!==BLOCK.GLASS&&b!==BLOCK.TORCH&&b!==BLOCK.LADDER&&b!==BLOCK.SAPLING&&b!==BLOCK.BED;
}
function hasSolidAt(worldCol,worldRow){
  const b=getBlock(worldCol,worldRow);
  return b!==BLOCK.AIR&&b!==BLOCK.GLASS&&b!==BLOCK.TORCH&&b!==BLOCK.LADDER&&b!==BLOCK.SAPLING&&b!==BLOCK.BED;
}

function updatePhysics(){
  if(showInGameMenu)return;
  const isRunning=keys['control']||keys['controlleft']||keys['controlright']||(phoneMode&&touchActive['sprint']);
  const sneakKey=phoneMode?sneakToggle:(keys['shift']||keys['s']||keys['arrowdown']);
  isSneaking=sneakKey;
  const speedMultiplier=isSneaking?0.5:1;
  const currentSpeed=(isRunning?RUN_SPEED:MOVE_SPEED)*speedMultiplier;
  const onLadder=isInLadder(player.x,player.y,player.w,player.h);
  const targetH=isSneaking?SNEAK_H:PLAYER_H;
  if(Math.abs(player.h-targetH)>0.5)player.h+=(targetH-player.h)*0.25;
  else player.h=targetH;
  sneakAnim=isSneaking?Math.min(1,sneakAnim+0.15):Math.max(0,sneakAnim-0.15);
  let dx=0;
  if(touchActive['left']||keys['a']||keys['arrowleft'])dx=-currentSpeed;
  if(touchActive['right']||keys['d']||keys['arrowright'])dx=currentSpeed;
  if(isSneaking&&player.onGround&&dx!==0&&!isSupportedAhead(dx))dx=0;
  if(dx!==0)player.facing=dx>0?1:-1;
  player.x+=dx;
  let blocks=getBlocksInRect(player.x,player.y,player.w,player.h);
  for(const b of blocks){if(dx>0)player.x=b.col*TILE-player.w;else if(dx<0)player.x=b.col*TILE+TILE;}
  if(onLadder){
    const upKey=touchActive['jump']||touchActive['up']||keys['w']||keys[' ']||keys['arrowup'];
    const downKey=touchActive['sneak']||touchActive['down']||keys['s']||keys['shift']||keys['arrowdown'];
    if(upKey)player.vy=-3;
    else if(downKey)player.vy=3;
    else player.vy=Math.min(player.vy+GRAVITY*0.5,3);
    player.onGround=false;
  }else{
    if(!player.onGround&&!player.isFalling){player.isFalling=true;player.fallStartY=player.y;}
    player.vy=Math.min(player.vy+GRAVITY,15);
  }
  player.y+=player.vy;player.onGround=false;
  blocks=getBlocksInRect(player.x,player.y,player.w,player.h);
  for(const b of blocks){
    if(player.vy>0){player.y=b.row*TILE-player.h;player.vy=0;player.onGround=true;}
    else if(player.vy<0){player.y=b.row*TILE+TILE;player.vy=0;}
  }
  if(player.onGround&&player.isFalling){
    const fd=Math.floor((player.y-player.fallStartY)/TILE);
    if(fd>3){const dmg=fd-3;player.health=Math.max(0,player.health-dmg);if(player.health<=0){player.health=player.maxHealth;player.x=player.spawnX;player.y=player.spawnY;player.vy=0;}}
    player.isFalling=false;
  }
  if(player.y>CHUNK_H*TILE+200){player.x=player.spawnX;player.y=player.spawnY;player.vy=0;player.health=player.maxHealth;player.isFalling=false;}
  if(player.y<0){player.y=0;player.vy=0;}
  const jumpKey=touchActive['jump']||touchActive['up']||keys[' ']||keys['w']||keys['arrowup'];
  if(jumpKey&&player.onGround&&!onLadder){player.vy=JUMP_VELOCITY;player.onGround=false;}
  if(bowCharging){
    bowCharge=Math.min(1000,bowCharge+16);
    if(!phoneMode){
      const cx=player.x+player.w/2;
      player.facing=(mouseWorldX>=cx)?1:-1;
    }
  }
}
function updateCamera(){
  camera.x=player.x+player.w/2-canvas.width/2;
  camera.y=player.y+player.h/2-canvas.height/2;
  if(camera.y<-TILE*10)camera.y=-TILE*10;
  if(camera.y>CHUNK_H*TILE-canvas.height+TILE*5)camera.y=CHUNK_H*TILE-canvas.height+TILE*5;
}
function updateTime(){
  gameTime++;
  if(gameTime>=DAY_LENGTH)gameTime=0;
  dayLight=(Math.cos(gameTime/DAY_LENGTH*Math.PI*2)+1)/2;
  isNight=dayLight<0.3;
}

function drawBackground(){
  const dayTop=[108,180,238],dayBot=[200,232,248];
  const nightTop=[10,10,46],nightBot=[42,42,78];
  const sunsetTop=[255,140,84],sunsetBot=[255,204,136];
  let top,bot;
  if(dayLight>0.5){const t=(dayLight-0.5)*2;top=lerpColor(sunsetTop,dayTop,t);bot=lerpColor(sunsetBot,dayBot,t);}
  else{const t=dayLight*2;top=lerpColor(nightTop,sunsetTop,t);bot=lerpColor(nightBot,sunsetBot,t);}
  const g=ctx.createLinearGradient(0,0,0,canvas.height);
  g.addColorStop(0,'rgb('+top[0]+','+top[1]+','+top[2]+')');
  g.addColorStop(1,'rgb('+bot[0]+','+bot[1]+','+bot[2]+')');
  ctx.fillStyle=g;ctx.fillRect(0,0,canvas.width,canvas.height);
}

function drawWorld(){
  const view=getViewRect();
  const sc=Math.floor(view.left/TILE)-1, ec=Math.ceil((view.left+view.w)/TILE)+1;
  const sr=Math.max(0,Math.floor(view.top/TILE)-1), er=Math.min(CHUNK_H-1,Math.ceil((view.top+view.h)/TILE)+1);
  for(let r=sr;r<=er;r++)for(let c=sc;c<=ec;c++){
    const b=getBlock(c,r);
    if(b===BLOCK.AIR)continue;
    if(b===BLOCK.DOOR_UPPER)continue;
    const sx=c*TILE-camera.x,sy=r*TILE-camera.y;
    const img=tileCanvasCache[b];
    if(b===BLOCK.DOOR_LOWER){
      const upperImg=tileCanvasCache[BLOCK.DOOR_UPPER];
      if(img||upperImg){
        const doorOpen=isDoorOpen(c,r);
        const doorW=doorOpen?TILE/4:TILE;
        const doorX=sx;
        const doorY=sy-TILE;
        if(upperImg){ctx.drawImage(upperImg,0,0,upperImg.width,upperImg.height,doorX,doorY,doorW,TILE);}
        if(img){ctx.drawImage(img,0,0,img.width,img.height,doorX,doorY+TILE,doorW,TILE);}
        if(doorOpen){ctx.fillStyle='rgba(255,255,255,0.15)';ctx.fillRect(doorX,doorY,doorW,TILE*2);}
      }
      continue;
    }
    if(img)ctx.drawImage(img,sx,sy,TILE,TILE);
    else{ctx.fillStyle='#888';ctx.fillRect(sx,sy,TILE,TILE);}
  }
  const mc=Math.floor(mouseWorldX/TILE),mr=Math.floor(mouseWorldY/TILE);
  if(mr>=0&&mr<CHUNK_H){
    if(!boxInitialized){animWorldCol=mc;animWorldRow=mr;boxInitialized=true;}
    animWorldCol+=(mc-animWorldCol)*BOX_LERP;
    animWorldRow+=(mr-animWorldRow)*BOX_LERP;
    if(Math.abs(mc-animWorldCol)<0.05)animWorldCol=mc;
    if(Math.abs(mr-animWorldRow)<0.05)animWorldRow=mr;
    const sx=animWorldCol*TILE-camera.x;
    const sy=animWorldRow*TILE-camera.y;
    ctx.strokeStyle='rgba(255,255,255,0.85)';ctx.lineWidth=2;
    ctx.strokeRect(sx+1,sy+1,TILE-2,TILE-2);
  }
}
function drawLightOverlay(){
  const view=getViewRect();
  const sc=Math.floor(view.left/TILE)-1, ec=Math.ceil((view.left+view.w)/TILE)+1;
  const sr=Math.max(0,Math.floor(view.top/TILE)-1), er=Math.min(CHUNK_H-1,Math.ceil((view.top+view.h)/TILE)+1);
  const envLight=dayLight*15;
  for(let r=sr;r<=er;r++)for(let c=sc;c<=ec;c++){
    const torchLight=getLight(c,r);
    const finalLight=Math.max(torchLight,envLight);
    const darkness=Math.max(0,1-finalLight/15);
    const sx=c*TILE-camera.x,sy=r*TILE-camera.y;
    if(darkness>0.02){ctx.fillStyle='rgba(0,0,15,'+(darkness*0.85)+')';ctx.fillRect(sx,sy,TILE,TILE);}
    if(torchLight>0){const glow=Math.min(1,torchLight/14)*0.32;ctx.fillStyle='rgba(255,255,255,'+glow+')';ctx.fillRect(sx,sy,TILE,TILE);}
  }
}

function drawDrops(){
  for(const d of drops){
    const sx=d.x-camera.x,sy=d.y-camera.y;
    if(sx<-40||sx>canvas.width+40||sy<-40||sy>canvas.height+40)continue;
    const img=itemIconCache[d.type];
    const bob=Math.sin(d.age*0.15)*2;
    if(img)ctx.drawImage(img,sx-DROP_SIZE/2,sy-DROP_SIZE/2+bob,DROP_SIZE,DROP_SIZE);
    if(d.count>1){
      ctx.fillStyle='#fff';ctx.font='bold 12px '+FONT;
      ctx.textAlign='right';ctx.textBaseline='bottom';
      ctx.strokeStyle='#000';ctx.lineWidth=2;
      const tx=sx+DROP_SIZE/2-2,ty=sy+DROP_SIZE/2-2;
      ctx.strokeText(d.count,tx,ty);ctx.fillText(d.count,tx,ty);
    }
  }
}
function drawFallingBlocks(){
  for(const fb of fallingBlocks){
    const sx=fb.x-camera.x-TILE/2,sy=fb.y-camera.y;
    if(sx<-TILE||sx>canvas.width||sy<-TILE||sy>canvas.height+TILE)continue;
    const img=tileCanvasCache[fb.type];
    if(img)ctx.drawImage(img,sx,sy,TILE,TILE);
    else{ctx.fillStyle='#888';ctx.fillRect(sx,sy,TILE,TILE);}
  }
}

function drawAnimals(){
  for(const a of animals){
    const sx=a.x-camera.x,sy=a.y-camera.y;
    let img=null;
    if(a.type==='sheep')img=sheepImage;
    else if(a.type==='chicken')img=chickenImage;
    else if(a.type==='cow')img=cowImage;
    if(img&&img.complete){
      ctx.save();ctx.imageSmoothingEnabled=false;
      if(a.hurtTimer>0)ctx.globalAlpha=0.6;
      let needFlip;
      if(a.type==='cow')needFlip=NEW_MOB_FLIP?(a.facing>0):(a.facing<0);
      else needFlip=a.facing>0;
      if(needFlip){ctx.translate(sx+a.w,sy);ctx.scale(-1,1);ctx.drawImage(img,0,0,a.w,a.h);}
      else ctx.drawImage(img,sx,sy,a.w,a.h);
      ctx.restore();
    }
    if(a.health<a.maxHealth){
      const bw=a.w,bh=4,bx=sx,by=sy-8;
      ctx.fillStyle='rgba(0,0,0,0.6)';ctx.fillRect(bx-1,by-1,bw+2,bh+2);
      ctx.fillStyle='#4caf50';ctx.fillRect(bx,by,bw*(a.health/a.maxHealth),bh);
    }
  }
}
function drawMonsters(){
  for(const m of monsters){
    const sx=m.x-camera.x,sy=m.y-camera.y;
    let img=null;
    if(m.type==='zombie')img=zombieImage;
    else if(m.type==='spider')img=spiderImage;
    else if(m.type==='skeleton')img=skeletonImage;
    if(img&&img.complete){
      ctx.save();ctx.imageSmoothingEnabled=false;
      if(m.hurtTimer>0)ctx.globalAlpha=0.6;
      let needFlip;
      if(m.type==='zombie'||m.type==='skeleton'){
        const iw=img.naturalWidth||1,ih=img.naturalHeight||1;
        const s=Math.min(m.w/iw,m.h/ih);
        const dw=iw*s,dh=ih*s;
        const dx=sx+(m.w-dw)/2,dy=sy+(m.h-dh)/2;
        if(m.facing>0){ctx.translate(dx+dw,dy);ctx.scale(-1,1);ctx.drawImage(img,0,0,dw,dh);}
        else ctx.drawImage(img,dx,dy,dw,dh);
        ctx.restore();
        if(m.health<m.maxHealth){
          const bw=m.w,bh=4,bx=sx,by=sy-8;
          ctx.fillStyle='rgba(0,0,0,0.6)';ctx.fillRect(bx-1,by-1,bw+2,bh+2);
          ctx.fillStyle='#4caf50';ctx.fillRect(bx,by,bw*(m.health/m.maxHealth),bh);
        }
        continue;
      }
      else needFlip=m.facing>0;
      if(needFlip){ctx.translate(sx+m.w,sy);ctx.scale(-1,1);ctx.drawImage(img,0,0,m.w,m.h);}
      else ctx.drawImage(img,sx,sy,m.w,m.h);
      ctx.restore();
    }else{
      ctx.save();
      if(m.type==='zombie'){ctx.fillStyle='#3a7a3a';ctx.fillRect(sx,sy,m.w,m.h);}
      else if(m.type==='skeleton'){ctx.fillStyle='#d0d0d0';ctx.fillRect(sx,sy,m.w,m.h);}
      else{ctx.fillStyle='#4a2a2a';ctx.fillRect(sx,sy,m.w,m.h);}
      ctx.restore();
    }
    if(m.health<m.maxHealth){
      const bw=m.w,bh=4,bx=sx,by=sy-8;
      ctx.fillStyle='rgba(0,0,0,0.6)';ctx.fillRect(bx-1,by-1,bw+2,bh+2);
      ctx.fillStyle=m.type==='zombie'?'#4caf50':(m.type==='skeleton'?'#dddddd':'#c62828');
      ctx.fillRect(bx,by,bw*(m.health/m.maxHealth),bh);
    }
  }
}
function drawArrows(){
  for(const a of arrows){
    const sx=a.x-camera.x,sy=a.y-camera.y;
    if(sx<-20||sx>canvas.width+20||sy<-20||sy>canvas.height+20)continue;

    ctx.fillStyle='#8b6914';

}

function drawPlayerArmor(sx,sy,drawW,drawH){
  const slots=[
    {idx:3,y0:0.82,y1:1.00,x0:0.10,x1:0.40,x2:0.60,x3:0.90},
    {idx:2,y0:0.55,y1:0.82,x0:0.08,x1:0.92},
    {idx:1,y0:0.28,y1:0.60,x0:0.05,x1:0.95},
    {idx:0,y0:0.00,y1:0.28,x0:0.10,x1:0.90}
  ];
  for(const p of slots){
    const armorItem=armorInventory[p.idx];
    if(!armorItem)continue;
    const img=itemIconCache[armorItem.type];
    if(!img)continue;
    ctx.save();
    ctx.globalAlpha=0.9;
    ctx.imageSmoothingEnabled=false;
    if(p.x2!==undefined){
      const y0=sy+drawH*p.y0,h=drawH*(p.y1-p.y0);
      const xa=sx+drawW*p.x0,wa=drawW*(p.x1-p.x0);
      const xb=sx+drawW*p.x2,wb=drawW*(p.x3-p.x2);
      ctx.drawImage(img,xa,y0,wa,h);
      ctx.drawImage(img,xb,y0,wb,h);
    }else{
      const y0=sy+drawH*p.y0,h=drawH*(p.y1-p.y0);
      const x=sx+drawW*p.x0,w=drawW*(p.x1-p.x0);
      ctx.drawImage(img,x,y0,w,h);
    }
    ctx.restore();
  }
}
function drawPlayer(){
  const sx=player.x-camera.x,sy=player.y-camera.y;
  const sf=sneakAnim*0.15;
  const drawH=player.h*(1-sf);
  const drawY=sy+player.h-drawH;
  if(playerSkin&&playerSkin.complete&&playerSkin.naturalWidth>0){
    const drawW=drawH*playerSkinAspect;
    const drawX=sx+player.w/2-drawW/2;
    const needFlip=SPRITE_FACES_RIGHT?(player.facing<0):(player.facing>0);
    ctx.save();ctx.imageSmoothingEnabled=false;
    if(needFlip){ctx.translate(drawX+drawW,drawY);ctx.scale(-1,1);ctx.drawImage(playerSkin,0,0,drawW,drawH);}
    else ctx.drawImage(playerSkin,drawX,drawY,drawW,drawH);
    ctx.restore();
    drawPlayerArmor(sx,drawY,player.w,drawH);
  }else{
    const pw=player.w,ph=drawH;
    ctx.fillStyle='#c99a6c';ctx.fillRect(sx+pw*0.15,drawY,pw*0.7,ph*0.3);
    ctx.fillStyle='#2d8a4e';ctx.fillRect(sx+pw*0.1,drawY+ph*0.3,pw*0.8,ph*0.4);
    ctx.fillStyle='#3a5a8a';ctx.fillRect(sx+pw*0.15,drawY+ph*0.7,pw*0.3,ph*0.3);ctx.fillRect(sx+pw*0.55,drawY+ph*0.7,pw*0.3,ph*0.3);
    drawPlayerArmor(sx,drawY,player.w,drawH);
  }
  const heldItem=inventory[selectedSlot];
  if(heldItem&&itemIconCache[heldItem.type]){
    const ix=sx+player.w/2+player.facing*10,iy=sy+player.h*0.4;
    ctx.save();
    ctx.translate(ix,iy);
    if(player.facing<0)ctx.scale(-1,1);
    ctx.drawImage(itemIconCache[heldItem.type],-8,-8,16,16);
    ctx.restore();
  }
  if(bowCharging){

function drawHealth(){
  const hs=20,hearts=10,sx0=15,sy0=15;
  for(let i=0;i<hearts;i++){
    const hx=sx0+i*(hs+2),hy=sy0;
    const hv=(i+1)*2,pv=i*2;
    if(player.health>=hv){
      if(heartIcon&&heartIcon.complete)ctx.drawImage(heartIcon,hx,hy,hs,hs);
      else{ctx.fillStyle='#f33';ctx.beginPath();ctx.arc(hx+10,hy+10,8,0,Math.PI*2);ctx.fill();}
    }else if(player.health>pv){
      ctx.save();ctx.beginPath();ctx.rect(hx,hy,hs/2,hs);ctx.clip();
      if(heartIcon&&heartIcon.complete)ctx.drawImage(heartIcon,hx,hy,hs,hs);
      ctx.restore();
      ctx.save();ctx.beginPath();ctx.rect(hx+hs/2,hy,hs/2,hs);ctx.clip();
      ctx.globalAlpha=0.3;
      if(heartIcon&&heartIcon.complete)ctx.drawImage(heartIcon,hx,hy,hs,hs);

function drawRecipeList(recipes,title,hint){
  const R=getRecipePanelRect(recipes);
  guiPanelRect=R;guiPanelRecipes=recipes;guiScrollMax=R.maxScroll;
  if(guiScrollOffset>R.maxScroll)guiScrollOffset=R.maxScroll;
  if(guiScrollOffset<0)guiScrollOffset=0;
  ctx.fillStyle='rgba(30,30,50,0.96)';
  ctx.fillRect(R.x,R.y,R.w,R.h);
  ctx.strokeStyle='#8a8aaa';ctx.lineWidth=3;
  ctx.strokeRect(R.x,R.y,R.w,R.h);
  ctx.save();
  ctx.beginPath();
  ctx.rect(R.x+1,R.y+1,R.w-2,R.h-2);
  ctx.clip();
  const oy=-guiScrollOffset;
  ctx.fillStyle='#fff';ctx.font='bold 18px '+FONT;ctx.textAlign='center';ctx.textBaseline='top';
  ctx.fillText(title,R.x+R.w/2,R.y+15+oy);
  const ic=28;
  const y0=R.y+R.headerH+oy;
  for(let i=0;i<recipes.length;i++){
    const r=recipes[i];
    const ry=y0+i*(R.rowH+R.rowGap);
    const rx=R.x+15,rw=R.w-40,rh=R.rowH;
    if(ry+rh<R.y-4||ry>R.y+R.h+4)continue;
    const cd=canCraft(r);
    ctx.fillStyle=cd?'rgba(80,160,80,0.22)':'rgba(120,60,60,0.22)';
    ctx.fillRect(rx,ry,rw,rh);
    ctx.strokeStyle=cd?'rgba(120,220,120,0.7)':'rgba(220,120,120,0.7)';
    ctx.lineWidth=2;
    ctx.strokeRect(rx,ry,rw,rh);
    let cx=rx+15;
    const cy=ry+rh/2;
    for(let j=0;j<r.inputs.length;j++){
      const inp=r.inputs[j];
      if(j>0){
        ctx.fillStyle='#fff';ctx.font='bold 18px '+FONT;
        ctx.textAlign='center';ctx.textBaseline='middle';
        ctx.fillText('+',cx+8,cy);
        cx+=22;
      }
      const ii=itemIconCache[inp.type];
      if(ii)ctx.drawImage(ii,cx,cy-ic/2,ic,ic);
      cx+=ic+4;
      ctx.fillStyle='#fff';ctx.font='bold 14px '+FONT;
      ctx.textAlign='left';ctx.textBaseline='middle';
      ctx.fillText('×'+inp.count,cx,cy);
      cx+=30;
    }
    ctx.fillStyle='#ffcc00';ctx.font='bold 22px '+FONT;
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('→',cx+10,cy);
    cx+=35;
    const oi=itemIconCache[r.output.type];
    if(oi)ctx.drawImage(oi,cx,cy-ic/2,ic,ic);
    cx+=ic+4;
    ctx.fillStyle='#fff';ctx.font='bold 14px '+FONT;
    ctx.textAlign='left';
    ctx.fillText('×'+r.output.count,cx,cy);
  }
  ctx.restore();
  ctx.fillStyle='rgba(0,0,0,0.75)';
  ctx.fillRect(R.x+1,R.y+R.h-R.footerH-1,R.w-2,R.footerH);
  ctx.fillStyle='rgba(255,255,255,0.75)';
  ctx.font='13px '+FONT;
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(hint,R.x+R.w/2,R.y+R.h-R.footerH/2);
  if(R.maxScroll>0){
    const sr=getGuiScrollbarRect(R);
    const thumbH=Math.max(30,sr.h*(R.h/R.contentH));
    const thumbY=sr.y+(sr.h-thumbH)*(guiScrollOffset/R.maxScroll);
    ctx.fillStyle='rgba(0,0,0,0.4)';ctx.fillRect(sr.x,sr.y,sr.w,sr.h);
    ctx.fillStyle='rgba(140,160,220,0.85)';ctx.fillRect(sr.x,sr.y+(thumbY-sr.y),sr.w,thumbH);
    ctx.strokeStyle='rgba(200,200,240,0.7)';ctx.lineWidth=1;
    ctx.strokeRect(sr.x+0.5,sr.y+(thumbY-sr.y)+0.5,sr.w-1,thumbH-1);
  }
}

function drawTouchControls(){
  if(!phoneMode||gameState!=='playing')return;
  const size=60;
  const padX=20,padY=canvas.height-200;
  const gap=60;
  const midX=padX+size+gap/2;
  touchButtons={
    left:{x:padX,y:padY+size,w:size,h:size},
    right:{x:padX+size+gap,y:padY+size,w:size,h:size},
    up:{x:midX-size/2,y:padY,w:size,h:size},
    down:{x:midX-size/2,y:padY+size*2,w:size,h:size},
    sneak:{x:midX-size/2,y:padY+size,w:size,h:size},
    jump:{x:canvas.width-90,y:canvas.height-140,w:70,h:70},
    inventory:{x:canvas.width-90,y:canvas.height-230,w:70,h:70},
    menu:{x:canvas.width/2-30,y:20,w:60,h:60}
  };
  ctx.save();
  for(const name in touchButtons){
    const btn=touchButtons[name];
    let active=touchActive[name];
    if(name==='up')active=active||touchActive['jump'];
    if(name==='down')active=active||touchActive['sneak'];
    if(name==='inventory')active=showInventory;
    if(name==='sneak'||name==='down')active=sneakToggle;
    ctx.globalAlpha=active?0.75:0.45;
    ctx.fillStyle=active?'#fff':'#000';
    ctx.fillRect(btn.x,btn.y,btn.w,btn.h);
    ctx.strokeStyle=active?'#fff':'#888';
    ctx.lineWidth=2;
    ctx.strokeRect(btn.x,btn.y,btn.w,btn.h);
    ctx.globalAlpha=0.9;
    ctx.fillStyle=active?'#000':'#fff';
    ctx.font='bold 22px '+FONT;
    ctx.textAlign='center';ctx.textBaseline='middle';
    let sym='';
    if(name==='left')sym='◀';else if(name==='right')sym='▶';
    else if(name==='up')sym='▲';else if(name==='down')sym='▼';
    else if(name==='jump')sym='⬆';else if(name==='sneak')sym='⬇';
    else if(name==='inventory')sym='包';
    else if(name==='menu')sym='三';
    ctx.fillText(sym,btn.x+btn.w/2,btn.y+btn.h/2);
  }
  ctx.restore();
}

function gameLoop(){
  frameCount++;
  const now=Date.now();
  if(now-lastFpsTime>=1000){fps=frameCount;frameCount=0;lastFpsTime=now;}
  updateKeyboardAnimation();
  if(isLoading){ctx.clearRect(0,0,canvas.width,canvas.height);drawLoadingScreen();requestAnimationFrame(gameLoop);return;}
  if(loadingAlpha>0){loadingAlpha-=LOADING_FADE_SPEED;if(loadingAlpha<0)loadingAlpha=0;}
  if(gameState!=='playing'&&menuSlide<1)menuSlide=Math.min(1,menuSlide+0.08);
  ctx.clearRect(0,0,canvas.width,canvas.height);
  if(gameState!=='playing'){
    drawMenuScreen();
    drawVirtualKeyboard();
    if(loadingAlpha>0){ctx.save();ctx.globalAlpha=loadingAlpha;drawLoadingScreen();ctx.restore();}
    requestAnimationFrame(gameLoop);return;
  }
  if(splitMode){const elapsed=Date.now()-splitMode.startTime;splitMode.progress=Math.min(100,elapsed/SPLIT_MAX_MS*100);}
  for(const[id,r]of touchRipples){if(r.fading){r.alpha-=0.05;if(r.alpha<=0)touchRipples.delete(id);}}
  const backpackTarget=(showInventory||showCraftingTable||showFurnace||showChest)?1:0;
  backpackAnim+=(backpackTarget-backpackAnim)*UI_ANIM_SPEED;
  uiProgress.inventory+=((showInventory?1:0)-uiProgress.inventory)*UI_ANIM_SPEED;
  uiProgress.crafting+=((showCraftingTable?1:0)-uiProgress.crafting)*UI_ANIM_SPEED;
  uiProgress.furnace+=((showFurnace?1:0)-uiProgress.furnace)*UI_ANIM_SPEED;
  uiProgress.chest+=((showChest?1:0)-uiProgress.chest)*UI_ANIM_SPEED;
  updateSelectorAnim();
  if(!showInGameMenu){
    updatePhysics();updateDrops();updateFallingBlocks();updateGravelPhysics();updateSaplings();
    updateAnimals();updateAnimalSpawning();updateMonsters();updateMonsterSpawning();
    updateArrows();updateMining();updateTime();updateGrassSpread();
  }
  updateCamera();unloadFarChunks();

  drawBackground();

  ctx.save();
  ctx.translate(canvas.width/2, canvas.height/2);
  ctx.scale(renderScale, renderScale);
  ctx.translate(-canvas.width/2, -canvas.height/2);
  drawWorld();
  drawLightOverlay();
  drawDrops();drawFallingBlocks();drawArrows();drawAnimals();drawMonsters();drawPlayer();
  ctx.restore();

  drawHUD();drawInventoryUI();drawCraftingTableUI();
  drawFurnaceUI();drawChestUI();drawBackpackGrid();drawCraftMessage();drawDragging();drawTouchControls();
  drawItemTooltip();
  drawTouchRipples();
  drawSplitBar();
  if(showInGameMenu)drawInGameMenu();
  drawLog();
  drawVirtualKeyboard();
  if(loadingAlpha>0){ctx.save();ctx.globalAlpha=loadingAlpha;drawLoadingScreen();ctx.restore();}
  requestAnimationFrame(gameLoop);
}
function start(){
  const s=getSurfaceHeight(8);
  player.x=8*TILE;player.y=(s-2)*TILE;
  loadingStartTime=Date.now();
  let cachedTime=0;
  try{cachedTime=parseInt(localStorage.getItem(CACHE_KEY)||'0');}catch(e){}
  loadingPhase=(cachedTime&&(Date.now()-cachedTime)<CACHE_DURATION)?'wait':'download';
  loadTextures(()=>{
    loadingPhase='wait';
    isLoading=false;gameState='menu';menuSlide=0;
  });
  lastFpsTime=Date.now();
  gameLoop();
}
start();
})();
</script>
